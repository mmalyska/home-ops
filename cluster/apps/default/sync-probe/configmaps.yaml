# Disposable application used to test the Argo CD sync permission of the dev-workspace account (home-ops plan
# .archive/.plans/remote-dev-workspace, T18 stage 2). It holds two ConfigMaps and no storage, no Secret and no workload, so
# nothing can be hurt by a sync, a prune or a sync to the wrong revision. Delete the directory when no longer needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-keep
data:
  purpose: stays in git; a sync leaves it alone
# probe-prune-me was removed from git on purpose: the live object stays (auto-sync has prune: false) until a sync with
# --prune deletes it. That is the prune test of the dev-workspace account's sync permission.
