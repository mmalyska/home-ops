apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: nextcloud-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: nextcloud-username
      remoteRef:
        key: "85edca08-6b77-4ccf-84b3-b47c0071c482" #gitleaks:allow #NEXTCLOUD_ADMIN_USERNAME
    - secretKey: nextcloud-password
      remoteRef:
        key: "3ac4781d-39c2-4f2a-8d0c-b47c0071fe0e" #gitleaks:allow #NEXTCLOUD_ADMIN_PASSWORD
