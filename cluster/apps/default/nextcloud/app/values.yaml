pgsql-cnpg:
  name: nextclouddb
  imageName: ghcr.io/cloudnative-pg/postgresql:15.10-standard-bookworm
  instances: 2
  storage:
    size: 10Gi
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  monitoring:
    enablePodMonitor: true
  # The `app` database's PUBLIC CONNECT grant was revoked out-of-band at
  # some point (confirmed live: `\l+ app` shows only `app=CTc/app`, no
  # PUBLIC entry, unlike every other CNPG database in this cluster). That
  # silently broke cnpg_metrics_exporter (member of pg_monitor, but never
  # had CONNECT on `app` to begin with) — confirmed via Loki: every
  # metrics scrape failed with "permission denied for database \"app\""
  # (SQLSTATE 42501), on both instances, continuously. Applied live via
  # `kubectl exec ... psql -U postgres -d app -c "GRANT CONNECT ..."`.
  # This only documents the grant for a future bootstrap (e.g. disaster
  # recovery from backup) — postInitApplicationSQL runs once at cluster
  # creation, not on the already-running cluster.
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - GRANT CONNECT ON DATABASE app TO cnpg_metrics_exporter
  retentionPolicy: "7d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/nextcloud"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: nextcloud-s3-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: nextcloud-s3-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: nextclouddb-cnpg-backup
      spec:
        immediate: true
        schedule: "15 0 0 * * *"
        backupOwnerReference: self

nextcloud:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "nextcloud-admin-secret,nextcloud-redis-auth"
  # mmalyska/containers: official fpm-alpine plus ffmpeg and exiftool (video previews, Memories)
  image:
    registry: ghcr.io
    repository: mmalyska/nextcloud
    tag: 35.0.2@sha256:7a2250b96698f406fcb2586a0faec2438b7ad07ab89f60f5686bbc41b37e2841
  nextcloud:
    # The runtime makes the render node owned by the container's uid:gid, so
    # group 82 (www-data, which runs php-fpm and ffmpeg) gets read/write on
    # /dev/dri/renderD128. Without it the node is root:root and VAAPI fails.
    securityContext:
      runAsGroup: 82
    extraEnv:
      - name: MAGICK_MEMORY_LIMIT
        value: 256MiB
      - name: MAGICK_MAP_LIMIT
        value: 512MiB
      - name: MAGICK_THREAD_LIMIT
        value: "1"
    host: nextcloud.<secret:private-domain>
    existingSecret:
      enabled: true
      secretName: nextcloud-admin-secret
      usernameKey: nextcloud-username
      passwordKey: nextcloud-password
    trustedDomains:
      - nextcloud.<secret:private-domain>
    datadir: /var/www/html/data
    persistence:
      subPath:
    mail:
      enabled: false
    configs:
      proxy.config.php: |-
        <?php
        $CONFIG = array (
          'check_data_directory_permissions' => false,
          'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          'mail_smtpmode' => 'null',
          'trusted_proxies' => array(
            0 => '127.0.0.1',
            1 => '10.244.0.0/16',
          ),
          // The Keycloak OIDC provider hostname resolves to an in-cluster/LAN
          // IP, which Nextcloud's SSRF protection blocks by default
          // (LocalServerException: "violates local access rules") when the
          // user_oidc app fetches the OIDC discovery document server-side.
          'allow_local_remote_servers' => true,
        ); ?>
      # enabledPreviewProviders REPLACES the upstream default list, so the 11
      # defaults must stay in it; HEIC (Samsung photos) and Movie (video
      # thumbnails, needs ffmpeg from the custom image) are the additions.
      # Without HEIC every HEIC thumbnail request returns 404.
      previews.config.php: |-
        <?php
        $CONFIG = array (
          'enabledPreviewProviders' => array(
            'OC\Preview\PNG',
            'OC\Preview\JPEG',
            'OC\Preview\GIF',
            'OC\Preview\BMP',
            'OC\Preview\XBitmap',
            'OC\Preview\Krita',
            'OC\Preview\WebP',
            'OC\Preview\AVIF',
            'OC\Preview\MarkDown',
            'OC\Preview\TXT',
            'OC\Preview\OpenDocument',
            'OC\Preview\HEIC',
            'OC\Preview\Movie',
          ),
          'preview_max_x' => 2048,
          'preview_max_y' => 2048,
          'preview_concurrency_new' => 2,
          'preview_concurrency_all' => 4,
        ); ?>
    # Default pm.max_children (5) is too small for real browsing load (Files
    # app fires many parallel requests per page: previews, notifications,
    # activity). Under load the pool saturates, the nginx sidecar's own
    # /status.php liveness probe queues behind it, times out, and kubelet
    # kills nginx -- surfacing to users as "upstream connect error ... remote
    # connection failure" after a few minutes of normal use.
    phpConfigs:
      zz-pool-size.conf: |-
        [www]
        pm = dynamic
        pm.max_children = 20
        pm.start_servers = 4
        pm.min_spare_servers = 2
        pm.max_spare_servers = 8
  phpClientHttpsFix:
    enabled: true
    protocol: https
  internalDatabase:
    enabled: false
  externalDatabase:
    enabled: true
    type: postgresql
    host: nextclouddb-cnpg-rw
    database: app
    existingSecret:
      enabled: true
      secretName: nextclouddb-cnpg-app
      usernameKey: username
      passwordKey: password
  # Redis is now provided by a per-app Dragonfly instance (see `dragonfly:` block
  # below), not the bundled Bitnami subchart. Setting `redis.enabled: false` makes
  # `nextcloud.env.redis` take the `externalRedis` branch instead (confirmed via
  # the chart's templates/_helpers.tpl) so REDIS_HOST/REDIS_HOST_PORT/REDIS_HOST_PASSWORD
  # get wired to the Dragonfly service below.
  redis:
    enabled: false
  externalRedis:
    enabled: true
    host: nextcloud-dragonfly
    port: 6379
    existingSecret:
      enabled: true
      secretName: nextcloud-redis-auth
      passwordKey: redis-password
  # The 1Gi limit OOM-killed the pod in a crash loop once HEIC and video
  # previews worked: php-fpm workers decode full-size photos (a 12 MP HEIC is
  # hundreds of MB in ImageMagick) and ffmpeg runs in the same cgroup. Nodes have
  # ~30 GiB. The MAGICK_* caps make ImageMagick spill to disk instead of RAM.
  # Memories transcodes 4K HEVC (Samsung HLG) to 1080p H.264 inside this
  # container. In software that saturated the 4 core limit, so it uses the
  # node's Intel iGPU through VAAPI (same device plugin resource as jellyfin).
  # The CPU limit stays as a backstop for the software fallback; the nodes have
  # 6 cores.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
      gpu.intel.com/i915: 1
    limits:
      cpu: "4"
      # One HDR transcode peaks at ~2.3 GiB (measured), so two at once need this.
      memory: 4Gi
      gpu.intel.com/i915: 1
  nginx:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ceph-block
    nextcloudData:
      enabled: true
      existingClaim: nextcloud-data-pvc
  cronjob:
    enabled: true
    type: sidecar
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 256Mi
  httpRoute:
    enabled: true
    annotations:
      external-dns.alpha.kubernetes.io/controller: dns-controller
    hostnames:
      - nextcloud.<secret:private-domain>
    parentRefs:
      - name: envoy-external
        namespace: envoy-gateway
        sectionName: https
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: "/"
        filters:
          - type: ResponseHeaderModifier
            responseHeaderModifier:
              add:
                - name: strict-transport-security
                  value: max-age=31536000

dragonfly:
  name: nextcloud
  authentication:
    existingSecret: nextcloud-redis-auth
    existingSecretKey: redis-password

# Scheduled `occ` commands, run as CronJobs that `kubectl exec` into the
# Nextcloud pod (see templates/occ-cronjobs.yaml). Each entry becomes the
# CronJob `nextcloud-occ-<name>`.
occJobs:
  # The ONLYOFFICE connector stores `settings_error` after one failed check and
  # then switches the editor off (xlsx downloads instead of opening). Its own
  # cron check never clears it, so re-run the check to self-heal.
  - name: connector-check
    schedule: "*/15 * * * *"
    command: ["onlyoffice:documentserver", "--check"]
  # Pre-generate the thumbnails for new uploads (previewgenerator app), so the
  # first view of a photo grid does not render them on demand in php-fpm. The
  # app is installed with occ, see docs/src/k8s/nextcloud.md.
  - name: preview-pre-generate
    schedule: "*/10 * * * *"
    command: ["preview:pre-generate"]
