---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media
spec:
  storageClassName: nfs-qnap
  claimRef:
    name: jellyfin-media
    namespace: jellyfin
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: {{ .Values.nfsMedia.nfsServer }}
    path: {{ .Values.nfsMedia.nfsPath | quote }}
  mountOptions:
    - nfsvers=4.1
    - tcp
    - intr
    - hard
    - noatime
    - nodiratime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media
  namespace: jellyfin
spec:
  volumeName: jellyfin-media
  storageClassName: nfs-qnap
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
