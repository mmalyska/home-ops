harbor:
  core:
    extraEnvVars:
      - name: CONFIG_OVERWRITE_JSON
        valueFrom:
          secretKeyRef:
            name: harbor-oidc-secret
            key: CONFIG_OVERWRITE_JSON

  expose:
    type: clusterIP
    tls:
      enabled: false
  externalURL: https://harbor.<secret:private-domain>

  # Admin password from cluster-secrets (substituted before Helm renders)
  harborAdminPassword: <secret:harbor-admin-password>

  persistence:
    enabled: true
    persistentVolumeClaim:
      registry:
        storageClass: ceph-block
        size: 200Gi
      jobservice:
        jobLog:
          storageClass: ceph-block
          size: 5Gi
      database:
        storageClass: ceph-block
        size: 2Gi
      redis:
        storageClass: ceph-block
        size: 2Gi
      trivy:
        storageClass: ceph-block
        size: 5Gi

  database:
    type: external
    external:
      host: harbordb-cnpg-rw
      port: "5432"
      username: app
      coreDatabase: app
      existingSecret: harbordb-cnpg-app
      sslmode: require

  # No password: Harbor's chart routes any external.password/existingSecret
  # through Helm's `urlquery` + `lookup` (templates/_helpers.tpl
  # harbor.redis.cred/pwdfromsecret) - `lookup` returns empty under this
  # repo's CMP plugin (a plain `helm template`, no live cluster API access;
  # see cluster/apps/core/argocd/resources/sops-replacer-plugin.yaml), and
  # urlquery mangles a `<secret:key>` token before the secret-replacer ever
  # sees it. Harbor's redis is a ClusterIP-only cache with no data worth
  # protecting, so this instance runs without auth instead of fighting that.
  redis:
    type: external
    external:
      addr: "harbor-dragonfly:6379"

  trivy:
    enabled: false

  notary:
    server:
      enabled: false
    signer:
      enabled: false

pgsql-cnpg:
  name: harbordb
  instances: 2
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/harbor"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: harbor-s3-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: harbor-s3-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: harbordb-cnpg-backup
      spec:
        immediate: true
        schedule: "5 0 0 * * *"
        backupOwnerReference: self

dragonfly:
  name: harbor
