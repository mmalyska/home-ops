dashboard:
  host: rook.<secret:private-domain>

rook-ceph-cluster:
  operatorNamespace: rook-ceph
  configOverride: |
    [mon]
    mon_data_avail_warn = 10
    [osd]
    # Async TRIM/discard lets the SSD firmware reclaim freed blocks
    # proactively instead of only on overwrite, reducing internal write
    # amplification (and thus wear) on the consumer-grade Crucial MX500
    # drives backing the OSDs. Async (not sync) avoids adding op latency.
    bdev_async_discard = true
    [mds]
    # Ceph's default is 4 GiB, which is more than double the MDS container
    # limit set below (2G). The cache limit is a target Ceph grows into, not
    # a bound the container enforces, so leaving it at the default means the
    # MDS expands until the kernel OOM-kills it. Only light CephFS use here
    # (~35 MiB resident), so 1 GiB is ample and sits well inside the limit.
    # If limits.memory for mds changes, revisit this — keep cache well below
    # it, since the daemon needs headroom beyond the cache itself.
    mds_cache_memory_limit = 1073741824
  monitoring:
    enabled: true
    createPrometheusRules: true
    rulesNamespaceOverride: monitoring
    prometheusRuleOverrides:
      # Upstream expr has no job filter, so it also matches non-cluster
      # node_network_* exporters (the qnap scrape job, and historically the
      # now-retired asusrouter one) rather than only cluster nodes. Scope to
      # job="node-exporter" like the bundled node-exporter mixin rules
      # already do for the same check.
      CephNodeNetworkPacketDrops:
        for: 5m
        expr: (rate(node_network_receive_drop_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_drop_total{device!="lo",job="node-exporter"}[1m])) / (rate(node_network_receive_packets_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_packets_total{device!="lo",job="node-exporter"}[1m])) >= 0.005 and (rate(node_network_receive_drop_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_drop_total{device!="lo",job="node-exporter"}[1m])) >= 10
      CephNodeNetworkPacketErrors:
        expr: (rate(node_network_receive_errs_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_errs_total{device!="lo",job="node-exporter"}[1m])) / (rate(node_network_receive_packets_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_packets_total{device!="lo",job="node-exporter"}[1m])) >= 0.0001 or (rate(node_network_receive_errs_total{device!="lo",job="node-exporter"}[1m]) + rate(node_network_transmit_errs_total{device!="lo",job="node-exporter"}[1m])) >= 10
  toolbox:
    enabled: true
  ingress:
    dashboard: {}
  route:
    dashboard:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      host:
        name: rook.<secret:private-domain>
        path: /
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
  cephClusterSpec:
    security:
      cephx:
        # Ceph tentacle (v20.2.x) flags `aes` cephx keys as insecure. The two
        # halves cannot be treated the same way:
        #
        # CSI keys MUST stay on `aes`. aes256k needs Linux 7.0+ in the kernel
        # RBD/CephFS client and these nodes run 6.18.42, so forcing aes256k
        # here would break every kernel mount and take out all PVCs. This
        # leaves AUTH_INSECURE_CLIENT_KEY_TYPE as a standing HEALTH_WARN
        # until the fleet is on a kernel that supports it — accepted.
        csi:
          keyType: aes
        # Daemons (osd/mds/mgr) are userspace Ceph processes with no kernel
        # client involved, so they take the stronger cipher. Rotating them is
        # what cleared AUTH_INSECURE_SERVICE_KEY_TYPE, the only [ERR] check,
        # and is also the CVE-2025-30156 remediation Rook documents.
        #
        # keyType is deliberately NOT set here. The Rook docs are explicit:
        # "Rook automatically detects the best CephX key type for daemon keys.
        # Do not set this unless required to work around an issue." The
        # operator log confirms it selects aes256k on its own, so the override
        # was a no-op asserting a value Rook already chose.
        #
        # keyRotationPolicy and keyGeneration must stay: per the CRD, with the
        # policy Disabled/unspecified no rotation is ever initiated. Bump
        # keyGeneration to rotate daemon keys again in future.
        daemon:
          keyRotationPolicy: KeyGeneration
          keyGeneration: 1
        # allowedCiphers is deliberately NOT set. It maps to
        # auth_allowed_ciphers, and the CRD warns it "can disrupt cluster
        # availability". Restricting it to aes256k would lock out the CSI
        # clients above, which must keep using aes.
    healthCheck:
      # These four warnings are all consequences of one unavoidable fact: the
      # CSI keys must stay on `aes` because aes256k needs Linux kernel 7.0+ in
      # the RBD/CephFS client, and no Talos release ships one — Talos tracks
      # the 6.18 longterm branch (nodes run 6.18.42; even v1.15.0-alpha is on
      # 6.18.49). ceph-csi must also reach v3.17.1; it is on v3.17.0.
      #
      # The Rook docs sanction exactly this: "It is expected that Rook
      # clusters will have constraints that prevent immediate resolution of
      # all warnings. Warnings that cannot be resolved immediately can be
      # ignored safely", and they document muteHealthWarning for it.
      #
      # Without muting, Ceph sits at HEALTH_WARN permanently, which keeps the
      # ArgoCD app Degraded and trains everyone to ignore its health — the
      # real cost, since a genuine future problem would look identical.
      #
      # NOT muted: AUTH_INSECURE_ROTATING_SERVICE_KEY_TYPE. It self-clears 2-3
      # hours after daemon rotation (confirmed: present at +1h22m, gone by
      # +3h41m), so muting it would hide a real transient signal.
      #
      # TO UNMUTE: once the fleet runs kernel 7.0+ AND ceph-csi >= v3.17.1,
      # follow the Rook "Migrating CSI keys to a new key type" guide, then
      # switch these to policy: unmute so stray aes keys become visible again.
      muteHealthWarning:
        # The 4 csi-* client keys, plus client.rbd-mirror-peer. Kernel-bound.
        AUTH_INSECURE_CLIENT_KEY_TYPE:
          policy: mute
        # Mons must keep accepting aes while the CSI keys use it.
        AUTH_INSECURE_KEYS_ALLOWED:
          policy: mute
        AUTH_INSECURE_KEYS_CREATABLE:
          policy: mute
        # Not in Rook's documented mute list, but muting the three above
        # without this one changes nothing: Ceph stays HEALTH_WARN and the
        # app stays Degraded. Rook itself sets
        # mon-auth-emergency-allowed-ciphers="aes,aes256k" (see the operator
        # log) precisely so mixed-cipher operation works, so this check is
        # reporting a state Rook deliberately configured and we require.
        AUTH_EMERGENCY_CIPHERS_SET:
          policy: mute
    # mgr.modules is deliberately not overridden here. It used to set the
    # `rook` module enabled: true, but from Ceph tentacle (20.2.x) the
    # operator disables that module unconditionally — "disabling the rook mgr
    # module for Ceph 20.2.4-0 tentacle / skipping rook mgr module
    # configuration" — so the override asserted the opposite of what happens.
    # Dropping it falls through to the chart default, which is
    # `rook: enabled: false` and matches the operator's real behaviour.
    # Do not re-add the override without checking the operator honours it.
    logCollector:
      enabled: false
    resources:
      mgr:
        requests:
          cpu: "50m"
          memory: "800M"
        limits:
          memory: "1219M"
      mon:
        requests:
          cpu: "49m"
          memory: "700M"
        limits:
          memory: "1059M"
      osd:
        requests:
          cpu: "150m"
          memory: "2678M"
        limits:
          memory: "5944M"
      mgr-sidecar:
        requests:
          cpu: "40m"
          memory: "32M"
        limits:
          memory: "208M"
      crashcollector:
        requests:
          cpu: "15m"
          memory: "64M"
        limits:
          memory: "64M"
      logcollector:
        requests:
          cpu: "100m"
          memory: "100M"
        limits:
          memory: "1G"
      cleanup:
        requests:
          cpu: "250m"
          memory: "100M"
        limits:
          memory: "1G"
    storage:
      useAllNodes: true
      useAllDevices: false
      config:
        osdsPerDevice: "1"
      devicePathFilter: /dev/disk/by-id/ata-CT500MX500SSD1_.*
    dashboard:
      enabled: true
      ssl: false
      urlPrefix: /
      prometheusEndpoint: http://prometheus-stack-kube-prom-prometheus.monitoring:9090
  cephBlockPools:
    - name: ceph-blockpool
      spec:
        failureDomain: host
        replicated:
          size: 3
        # ceph-blockpool carries nearly all cluster write traffic (RBD PVCs);
        # compression here directly cuts bytes written to the SSDs, reducing
        # wear on the consumer-grade Crucial MX500 OSD drives.
        parameters:
          compression_mode: aggressive
          compression_algorithm: lz4
      storageClass:
        enabled: true
        name: ceph-block
        isDefault: true
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        parameters:
          imageFormat: "2"
          imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
          # NOTE: do not add csi.storage.k8s.io/controller-publish-secret-name
          # or -namespace here. Overriding this map does drop the chart's
          # defaults for them, but StorageClass.parameters is IMMUTABLE — the
          # API server rejects any change with "updates to parameters are
          # forbidden", which breaks ArgoCD's server-side diff and leaves this
          # app unable to sync at all. Adding them would require deleting and
          # recreating both StorageClasses, and ceph-block is the cluster
          # default, so a PVC created during that window would fail. ceph-csi's
          # ControllerPublish does not need these credentials in practice, so
          # the parity is not worth the disruption.
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
          csi.storage.k8s.io/fstype: ext4
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    name: csi-ceph-blockpool
    # Neither snapshot class is default here; the cluster-wide default comes
    # from the snapshot-controller app (csi-rbdplugin-snapclass). Stated on
    # both classes so the pair reads consistently — the cephfs one below is a
    # real override, since the chart defaults that one to true.
    isDefault: false
  cephFileSystems:
    - name: ceph-filesystem
      spec:
        metadataPool:
          replicated:
            size: 3
        dataPools:
          - failureDomain: host
            replicated:
              size: 3
            name: data0
        metadataServer:
          activeCount: 1
          activeStandby: true
          resources:
            requests:
              cpu: "35m"
              memory: "64M"
            limits:
              memory: "2G"
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        isDefault: false
        name: ceph-filesystem
        pool: data0
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: Immediate
        mountOptions: []
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
          # See the rbd storageClass above: the controller-publish pair is
          # deliberately absent because StorageClass.parameters is immutable.
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
          csi.storage.k8s.io/fstype: ext4
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    name: csi-ceph-filesystem
    isDefault: false
  cephObjectStores: []
