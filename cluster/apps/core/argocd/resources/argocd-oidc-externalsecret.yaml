apiVersion: external-secrets.io/v1
kind: ExternalSecret
# Also carries webhook.github.secret (GitHub webhook HMAC secret, shared by argocd-server
# and the ApplicationSet controller); the name is kept to avoid recreating the object.
metadata:
  name: argocd-oidc-secret
  namespace: argocd
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: argocd-secret
    creationPolicy: Merge
    # Define template metadata explicitly so ESO does not inherit this
    # ExternalSecret's own labels/annotations onto argocd-secret. Without
    # this, ESO copies its argocd.argoproj.io/tracking-id onto the shared
    # secret, clobbering ArgoCD's own tracking-id and leaving the argocd
    # Application permanently OutOfSync on that annotation.
    template:
      engineVersion: v2
      mergePolicy: Merge
      metadata: {}
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef:
        key: "46ab751a-5867-48e9-ad9e-b40a00990348" #gitleaks:allow #ARGOCD_OIDC_KEYCLOAK_CLIENT_SECRET
    - secretKey: webhook.github.secret
      remoteRef:
        key: "23e7d9e0-5f84-4b40-b1e9-b506009e00f2" #gitleaks:allow #ARGOCD_GITHUB_WEBHOOK_SECRET
