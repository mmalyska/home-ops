---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  url: "https://argocd.<secret:private-domain>"
  admin.enabled: "true"
  statusbadge.enabled: "true"
  resource.customizations.useOpenLibs.cert-manager.io_Certificate: "true"
  users.session.duration: "24h"
  timeout.reconciliation: "1h"
  accounts.mmalyska: apiKey,login
  # API key only, no password login: the token for the Coder dev workspace (T18). Policy in argocd-rbac-cm.
  accounts.dev-workspace: apiKey
  # A sync to a revision other than the application's targetRevision (an unmerged branch, an older commit)
  # needs the `override` action, which no policy grants to dev-workspace. New since Argo CD v3.2.
  application.sync.requireOverridePrivilegeForRevisionSync: "true"
  oidc.config: |
    name: Keycloak
    issuer: https://l.<secret:private-domain>/realms/home
    clientID: argocd
    clientSecret: $oidc.keycloak.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    cliClientID: argocd-cli
  resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
    jqPathExpressions:
    - '.webhooks[]?.clientConfig.caBundle'
  resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
    jqPathExpressions:
    - '.webhooks[]?.clientConfig.caBundle'
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"
