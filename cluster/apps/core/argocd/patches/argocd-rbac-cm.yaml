---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  policy.default: ""
  policy.csv: |
    g, ArgoCDAdmins, role:admin
    g, mmalyska, role:admin

    # Local account dev-workspace (Coder dev workspace, API key only). Direct policies, not a role
    # assignment: with SSO enabled Argo CD warns that a `g` line for a local name is ambiguous.
    # Read, and refresh (a hard refresh needs only `get`): every application. Live Secret values are
    # masked in the responses.
    p, dev-workspace, applications, get, */*, allow
    # Read projects: `argocd app get` also fetches the application's project and fails without it. Project
    # `get` returns the project spec (source repositories, destinations, roles) and no credentials.
    p, dev-workspace, projects, get, *, allow
    # Sync, and prune (a sync option, not a separate permission): only the allowlist below. The owner adds
    # one line per application by reviewed PR, in the form
    #   p, dev-workspace, applications, sync, <project>/<application>, allow
    # and puts argocd.argoproj.io/sync-options: Prune=false on that application's PVCs and stateful
    # owners. Never grant: override (selects another revision), delete, create, update, action/*, exec,
    # and anything on repositories, clusters, accounts or certificates, and any project action other than
    # `get`. Initial exclusions:
    # argocd itself, bootstrap and the ApplicationSets, access-control infrastructure, storage
    # operators and the dev-workspace app.
    # First entry: the disposable test application (two ConfigMaps, no storage). Real applications come
    # later, one reviewed PR each.
    p, dev-workspace, applications, sync, default/sync-probe, allow
  # scopes: '[email]'
