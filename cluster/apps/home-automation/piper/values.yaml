app-template:
  controllers:
    piper:
      strategy: Recreate
      containers:
        pl:
          image:
            repository: rhasspy/wyoming-piper
            tag: 2.4.0@sha256:fd574ef5c9fe199a337a4c9f14b745d5140eeaba593153a43eb74048629562b2
            pullPolicy: IfNotPresent
          args:
            - --voice
            - pl_PL-darkman-medium
            - --update-voices
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 4000m
              memory: 2Gi
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
  service:
    pl:
      annotations:
        lbipam.cilium.io/sharing-key: "voice-pipeline"
        lbipam.cilium.io/sharing-cross-namespace: "*"
        lbipam.cilium.io/ips: "192.168.48.27"
      type: LoadBalancer
      controller: piper
      ports:
        tcp:
          port: 10200
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
