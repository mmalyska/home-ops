---
# Eclipse Mosquitto replaces RabbitMQ's MQTT plugin: the plugin never sends retained messages to
# wildcard subscriptions, which is how Home Assistant discovers MQTT devices after a restart.
app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 1883
      runAsGroup: 1883
      runAsNonRoot: true
      fsGroup: 1883
      fsGroupChangePolicy: "OnRootMismatch"
  controllers:
    main:
      annotations:
        secret.reloader.stakater.com/reload: "mosquitto-secret"
      strategy: Recreate
      replicas: 1
      initContainers:
        passwd:
          image: &image
            repository: eclipse-mosquitto
            tag: 2.1.2-alpine@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
          envFrom:
            - secretRef:
                name: mosquitto-secret
          command:
            - sh
            - -c
            - |
              set -e
              f=/mosquitto/generated/passwd
              : > $f
              mosquitto_passwd -b $f "$HOME_ASSISTANT_USERNAME" "$HOME_ASSISTANT_PASSWORD"
              mosquitto_passwd -b $f "$ZIGBEE2MQTT_USERNAME" "$ZIGBEE2MQTT_PASSWORD"
              chmod 0600 $f
      containers:
        main:
          image: *image
          probes:
            liveness: &probe
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 1883
                initialDelaySeconds: 5
                periodSeconds: 10
                timeoutSeconds: 3
            readiness: *probe
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 128Mi
  service:
    main:
      controller: main
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.48.26"
      ports:
        mqtt:
          port: 1883
  configMaps:
    config:
      data:
        mosquitto.conf: |
          listener 1883
          allow_anonymous false
          password_file /mosquitto/generated/passwd
          persistence true
          persistence_location /mosquitto/data/
          autosave_interval 60
          log_dest stdout
          log_type error
          log_type warning
          log_type notice
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        main:
          main:
            - path: /mosquitto/data
    config:
      type: configMap
      identifier: config
      advancedMounts:
        main:
          main:
            - path: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
    generated:
      type: emptyDir
      advancedMounts:
        main:
          passwd:
            - path: /mosquitto/generated
          main:
            - path: /mosquitto/generated
              readOnly: true
