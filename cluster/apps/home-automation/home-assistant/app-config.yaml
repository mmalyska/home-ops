- enabled: "true"
  namespace: ha-home-assistant
  managedNamespaceMetadata:
    annotations:
      # VolSync drops all capabilities from root movers unless this is set;
      # a restore then fails to lchown and exits non-zero (2026-11-21)
      volsync.backube/privileged-movers: "true"
  syncPolicy:
    enabled: true
    selfHeal: true
    prune: false
  plugin:
    env:
      - name: SECRET_PROVIDER
        value: cluster-secrets
