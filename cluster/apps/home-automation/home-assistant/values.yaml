pgsql-cnpg:
  name: home-assistant
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-bookworm
  instances: 2
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  # bootstrap:
  #   recovery:
  #     source: home-assistant-cnpg-backup
  # externalClusters:
  #   - name: home-assistant-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: home-assistant-objectstore
  objectStore:
    # -v2: the original path still holds a previous cluster's WAL/backups, which makes
    # barman fail with "Expected empty archive" and blocks archiving. Left untouched on purpose.
    destinationPath: "s3://k8s-at-home-backup/cnpg/home-assistant-v2"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: home-assistant-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: home-assistant-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: home-assistant-cnpg-backup
      spec:
        immediate: true
        schedule: "52 0 0 * * *"
        backupOwnerReference: self
app-template:
  defaultPodOptions:
    # macvlan (net1) needs the node's eth0, which only the control-plane nodes have
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
  controllers:
    main:
      type: statefulset
      strategy: RollingUpdate
      replicas: 1
      pod:
        annotations:
          k8s.v1.cni.cncf.io/networks: '[{"name":"vlan48","ips":["192.168.48.60/24"]}]'
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.10.0@sha256:1b64d38f38d922bf9d59336451fd6453e1d614f934456af4ee3d2a51061be3a4
          envFrom:
            - secretRef:
                name: home-assistant-secret
          env:
            # referenced from configuration.yaml: recorder: db_url: !env_var RECORDER_DB_URL
            RECORDER_DB_URL:
              valueFrom:
                secretKeyRef:
                  name: home-assistant-cnpg-app
                  key: uri
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 750Mi
    addons:
      containers:
        codeserver:
          image:
            repository: ghcr.io/coder/code-server
            tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
          workingDir: "/config"
          args:
            - --auth
            - "none"
            - --user-data-dir
            - "/config/.vscode"
            - --extensions-dir
            - "/config/.vscode"
  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
    codeserver:
      controller: addons
      ports:
        http:
          port: 8080
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-external
          namespace: envoy-gateway
          sectionName: https
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - hass.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
    addons:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - hass-code.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: codeserver
  persistence:
    config:
      existingClaim: home-assistant-config

volsync:
  pvc:
    existingClaim: home-assistant-config
    accessMode: ReadWriteMany
    capacity: 10Gi
    storageClass: ceph-filesystem
    volumeSnapshotClass: csi-ceph-filesystem
  volsync:
    # root mover: reads files of any owner from the snapshot
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    backup:
      schedule: "0 */6 * * *"
      pruneIntervalDays: 14
      retain:
        hourly: 0
        daily: 6
        weekly: 4
        monthly: 2
    restore:
      # existing data: never render the restore-once ReplicationDestination
      enabled: false
      bootstrap: false
