pgsql-cnpg:
  name: home-assistant
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-bookworm
  instances: 2
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  # bootstrap:
  #   recovery:
  #     source: home-assistant-cnpg-backup
  # externalClusters:
  #   - name: home-assistant-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: home-assistant-objectstore
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/home-assistant"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: home-assistant-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: home-assistant-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: home-assistant-cnpg-backup
      spec:
        immediate: true
        schedule: "52 0 0 * * *"
        backupOwnerReference: self
app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
  controllers:
    main:
      type: statefulset
      strategy: RollingUpdate
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.7.3@sha256:6937c6c51d2f5d6aa66d97e4a68f845bcccd5f9b62cd91992bd6d79b20fe2b3c
          envFrom:
            - secretRef:
                name: home-assistant-secret
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 750Mi
    addons:
      containers:
        codeserver:
          image:
            repository: ghcr.io/coder/code-server
            tag: 4.130.0@sha256:fa367e7eddd303a95c736f7aede351cdee9036a7383cecfd8786bb5bbe78c13b
          workingDir: "/config"
          args:
            - --auth
            - "none"
            - --user-data-dir
            - "/config/.vscode"
            - --extensions-dir
            - "/config/.vscode"
  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
    codeserver:
      controller: addons
      ports:
        http:
          port: 8080
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - dom.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
    addons:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - dom-code.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: codeserver
  persistence:
    config:
      existingClaim: home-assistant-config
