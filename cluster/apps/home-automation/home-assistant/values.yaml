pgsql-cnpg:
  name: home-assistant
  imageName: ghcr.io/cloudnative-pg/postgresql:17-standard-bookworm
  instances: 2
  storage:
    size: 5Gi
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  # bootstrap:
  #   recovery:
  #     source: home-assistant-cnpg-backup
  # externalClusters:
  #   - name: home-assistant-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: home-assistant-objectstore
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/home-assistant"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: home-assistant-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: home-assistant-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: home-assistant-cnpg-backup
      spec:
        immediate: true
        schedule: "52 0 0 * * *"
        backupOwnerReference: self
app-template:
  defaultPodOptions:
    # macvlan (net1) needs the node's eth0, which only the control-plane nodes have
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
  controllers:
    main:
      type: statefulset
      strategy: RollingUpdate
      # Held at 0 for the final config restore; set back to 1 right after
      replicas: 0
      pod:
        annotations:
          k8s.v1.cni.cncf.io/networks: '[{"name":"vlan48","ips":["192.168.48.60/24"]}]'
      containers:
        main:
          image:
            repository: ghcr.io/home-assistant/home-assistant
            tag: 2026.9.4@sha256:3e6710a7ab2a61311d9d899b719f6c3657791c63e8f4942cec4ebc42401d6b76
          envFrom:
            - secretRef:
                name: home-assistant-secret
          env:
            # referenced from configuration.yaml: recorder: db_url: !env_var RECORDER_DB_URL
            RECORDER_DB_URL:
              valueFrom:
                secretKeyRef:
                  name: home-assistant-cnpg-app
                  key: uri
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
            limits:
              memory: 750Mi
    addons:
      containers:
        codeserver:
          image:
            repository: ghcr.io/coder/code-server
            tag: 4.140.0@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
          workingDir: "/config"
          args:
            - --auth
            - "none"
            - --user-data-dir
            - "/config/.vscode"
            - --extensions-dir
            - "/config/.vscode"
  service:
    main:
      controller: main
      ports:
        http:
          port: 8123
    codeserver:
      controller: addons
      ports:
        http:
          port: 8080
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-external
          namespace: envoy-gateway
          sectionName: https
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - hass.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
    addons:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - hass-code.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: codeserver
  persistence:
    config:
      existingClaim: home-assistant-config
