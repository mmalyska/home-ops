app-template:
  defaultPodOptions:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
  controllers:
    main:
      strategy: Recreate
      replicas: 1
      pod:
        annotations:
          k8s.v1.cni.cncf.io/networks: '[{"name":"vlan48","ips":["192.168.48.62/24"]}]'
      containers:
        main:
          image:
            repository: ghcr.io/music-assistant/server
            tag: 2.10.4@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
          env:
            TZ: Europe/Warsaw
            LOG_LEVEL: info
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
  service:
    main:
      controller: main
      ports:
        http:
          port: 8095
        stream:
          port: 8097
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - ma.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
              port: http
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      globalMounts:
        - path: /data
    library:
      type: nfs
      server: 192.168.50.8
      path: /music
      globalMounts:
        - path: /media/music
          readOnly: true
