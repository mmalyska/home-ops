app-template:
  defaultPodOptions:
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
  controllers:
    main:
      strategy: Recreate
      replicas: 1
      pod:
        annotations:
          k8s.v1.cni.cncf.io/networks: '[{"name":"vlan48","ips":["192.168.48.62/24"]}]'
      containers:
        main:
          image:
            repository: ghcr.io/music-assistant/server
            tag: 2.10.6@sha256:45fdb050e06962097a07feeb092606ad119fac17965c8228a57146448d5fa772
          env:
            TZ: Europe/Warsaw
            LOG_LEVEL: info
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
  service:
    main:
      controller: main
      ports:
        http:
          port: 8095
        stream:
          port: 8097
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - ma.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
              port: http
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 5Gi
      globalMounts:
        - path: /data
    library:
      type: nfs
      server: 192.168.50.8
      path: /music
      globalMounts:
        - path: /media/music
          readOnly: true

volsync:
  pvc:
    existingClaim: music-assistant
    accessMode: ReadWriteOnce
    capacity: 5Gi
    storageClass: ceph-block
    volumeSnapshotClass: csi-ceph-blockpool
  volsync:
    # root mover: reads files of any owner from the snapshot
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    backup:
      schedule: "0 */6 * * *"
      pruneIntervalDays: 14
      retain:
        hourly: 0
        daily: 6
        weekly: 4
        monthly: 2
    restore:
      # existing data: never render the restore-once ReplicationDestination
      enabled: false
      bootstrap: false
