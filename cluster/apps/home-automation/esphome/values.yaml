app-template:
  defaultPodOptions:
    # macvlan parent interface exists on the control-plane nodes only
    nodeSelector:
      node-role.kubernetes.io/control-plane: ""
  controllers:
    main:
      strategy: Recreate
      replicas: 1
      pod:
        annotations:
          # IoT devices are on VLAN 40; mDNS discovery needs a VLAN 48 presence (UniFi mDNS repeater)
          k8s.v1.cni.cncf.io/networks: '[{"name":"vlan48","ips":["192.168.48.63/24"]}]'
      containers:
        main:
          image:
            repository: ghcr.io/esphome/esphome
            tag: 2026.11.1@sha256:eb1a5383cb1ce62df8683d7d728deaa5d8d78f0de0c6dccc9e3215cda53a1c6f
          env:
            TZ: Europe/Warsaw
            ESPHOME_DASHBOARD_USE_PING: "false"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              # firmware compiles peak well above the idle dashboard: a
              # 2Gi limit OOM-killed a compile at ~2Gi resident memory
              memory: 4Gi
  service:
    main:
      controller: main
      ports:
        http:
          port: 6052
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - esphome.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
              port: http
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /config
    # PlatformIO toolchains and build cache: large, rebuildable, not backed up
    cache:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      globalMounts:
        - path: /cache

volsync:
  pvc:
    existingClaim: esphome-data
    accessMode: ReadWriteOnce
    capacity: 1Gi
    storageClass: ceph-block
    volumeSnapshotClass: csi-ceph-blockpool
  volsync:
    # root mover: reads files of any owner from the snapshot
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
    backup:
      schedule: "0 */6 * * *"
      pruneIntervalDays: 14
      retain:
        hourly: 0
        daily: 6
        weekly: 4
        monthly: 2
    restore:
      # new app, no data to restore yet
      enabled: false
      bootstrap: false
