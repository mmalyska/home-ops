app-template:
  defaultPodOptions:
    securityContext:
      runAsUser: 568
      runAsGroup: 568
      fsGroup: 568
      fsGroupChangePolicy: "OnRootMismatch"
  controllers:
    main:
      replicas: 0 # data restore first (Task 1.2); flipped to 1 in Task 1.3
      strategy: Recreate
      containers:
        main:
          image:
            repository: koenkk/zigbee2mqtt
            tag: 2.14.2@sha256:addbfb08fcef2e4477de1535636118241e10d13e898fbe4d9faba8a4d7396311
          envFrom:
            - secretRef:
                name: zigbee2mqtt-secret
          env:
            TZ: Europe/Warsaw
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
  service:
    main:
      controller: main
      ports:
        http:
          port: 8080
  route:
    main:
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - z2m.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: main
  persistence:
    data:
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 1Gi
      globalMounts:
        - path: /app/data
