---
apiVersion: batch/v1
kind: Job
metadata:
  name: wow-scale-down
  namespace: wow
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: default
      containers:
        - name: scale-down
          image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
          command:
            - sh
            - -c
            - |
              kubectl scale deployment wow-worldserver wow-authserver --replicas=0 -n wow || true
              kubectl rollout status deployment/wow-worldserver -n wow --timeout=120s || true
              kubectl rollout status deployment/wow-authserver -n wow --timeout=120s || true
