---
apiVersion: batch/v1
kind: Job
metadata:
  name: wow-db-import
  namespace: wow
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
          command:
            - sh
            - -c
            - |
              until mysqladmin ping -h mysql -u root -p$MYSQL_ROOT_PASSWORD --silent; do
                echo "waiting for mysql..."; sleep 5
              done
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wow-mysql-secret
                  key: MYSQL_ROOT_PASSWORD
      containers:
        - name: db-import
          image: ghcr.io/mmalyska/azerothcore-db-import:rolling@sha256:f81ea00bb6c6914cf9c55bd476175f983f6fcf9ffa128c41c7f42f6182432de3
          env:
            - name: AC_DATA_DIR
              value: /azerothcore/env/dist/data
            - name: AC_LOGS_DIR
              value: /azerothcore/env/dist/logs
            - name: AC_LOGIN_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: wow-mysql-secret
                  key: AC_LOGIN_DATABASE_INFO_ROOT
            - name: AC_WORLD_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: wow-mysql-secret
                  key: AC_WORLD_DATABASE_INFO_ROOT
            - name: AC_CHARACTER_DATABASE_INFO
              valueFrom:
                secretKeyRef:
                  name: wow-mysql-secret
                  key: AC_CHARACTER_DATABASE_INFO_ROOT
            - name: AC_REALM_ADDRESS
              value: {{.Values.realmAddress | quote}}
