apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-api
  annotations:
    secret.reloader.stakater.com/reload: "honcho-secrets,honcho-litellm"
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-api
  template:
    metadata:
      labels:
        app: honcho-api
    spec:
      # Never calls the Kubernetes API.
      automountServiceAccountToken: false
      # The image's own user (app, 100:101); set explicitly so runAsNonRoot can verify it.
      securityContext:
        runAsUser: 100
        runAsGroup: 101
      volumes:
        - name: tmp
          emptyDir: {}
        - name: lancedb
          emptyDir: {}
      initContainers:
        # A fresh database is migrated to vector(1536); Honcho refuses to start
        # until the columns match EMBEDDING_VECTOR_DIMENSIONS. The script is a
        # no-op when they match and refuses to alter tables that hold data.
        - name: configure-embeddings
          image: "{{ .Values.honcho.image.repository }}:{{ .Values.honcho.image.tag }}"
          command:
            - sh
            - -c
            - /app/.venv/bin/python scripts/provision_db.py && /app/.venv/bin/python scripts/configure_embeddings.py --yes
          env:
            {{- include "honcho.llmEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: lancedb
              mountPath: /app/lancedb_data
      containers:
        - name: honcho-api
          image: "{{ .Values.honcho.image.repository }}:{{ .Values.honcho.image.tag }}"
          command: ["sh", "docker/entrypoint.sh"]
          env:
            {{- include "honcho.llmEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources: {{toYaml .Values.honcho.resources | nindent 12}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: lancedb
              mountPath: /app/lancedb_data
