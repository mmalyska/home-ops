apiVersion: apps/v1
kind: Deployment
metadata:
  name: honcho-deriver
  annotations:
    secret.reloader.stakater.com/reload: "honcho-secrets,honcho-litellm"
  namespace: honcho
spec:
  replicas: 1
  selector:
    matchLabels:
      app: honcho-deriver
  template:
    metadata:
      labels:
        app: honcho-deriver
    spec:
      # Never calls the Kubernetes API.
      automountServiceAccountToken: false
      # The image's own user (app, 100:101); set explicitly so runAsNonRoot can verify it.
      securityContext:
        runAsUser: 100
        runAsGroup: 101
      volumes:
        - name: tmp
          emptyDir: {}
        - name: lancedb
          emptyDir: {}
      containers:
        - name: honcho-deriver
          image: "{{ .Values.honcho.image.repository }}:{{ .Values.honcho.image.tag }}"
          command: ["/app/.venv/bin/python", "-m", "src.deriver"]
          env:
            {{- include "honcho.llmEnv" . | nindent 12 }}
          resources: {{toYaml .Values.honcho.deriver.resources | nindent 12}}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: lancedb
              mountPath: /app/lancedb_data
