honcho:
  image:
    repository: ghcr.io/plastic-labs/honcho
    tag: "v3.4.0@sha256:6a8c74cf6cbd51a0e14e56b6b8503b4182f546059eb9d7d0190ac177cf075603"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  deriver:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

pgsql-cnpg:
  name: honchodb
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  instances: 2
  storage:
    size: 30Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  bootstrap:
    initdb:
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector
  # Uncomment to restore from S3 backup (requires at least one successful backup to exist):
  # bootstrap:
  #   recovery:
  #     source: honchodb-cnpg-backup
  externalClusters:
    - name: honchodb-cnpg-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: honchodb-objectstore
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "7d"
  objectStore:
    # Not cnpg/honcho: that prefix still holds the archived cluster's WAL and barman
    # refuses to archive into a non-empty prefix ("Expected empty archive").
    destinationPath: "s3://k8s-at-home-backup/cnpg/honcho-2026-10"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: honcho-secrets
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: honcho-secrets
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: honchodb-cnpg-backup
      spec:
        immediate: true
        schedule: "10 0 0 * * *"
        backupOwnerReference: self
