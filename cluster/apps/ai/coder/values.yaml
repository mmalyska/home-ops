---
coder:
  coder:
    annotations:
      secret.reloader.stakater.com/reload: "coder-secrets"
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    env:
      # Database — built from CNPG-managed secret using K8s env var substitution
      - name: PGUSER
        valueFrom:
          secretKeyRef:
            name: coderdb-cnpg-app
            key: username
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: coderdb-cnpg-app
            key: password
      - name: CODER_PG_CONNECTION_URL
        value: "postgres://$(PGUSER):$(PGPASSWORD)@coderdb-cnpg-rw/app?sslmode=require"
      # Access URL (uses cluster-secrets plugin substitution)
      - name: CODER_ACCESS_URL
        value: "https://coder.<secret:private-domain>"
      # Keycloak OIDC
      - name: CODER_OIDC_ISSUER_URL
        value: "https://l.<secret:private-domain>/realms/home"
      - name: CODER_OIDC_CLIENT_ID
        value: "coder"
      - name: CODER_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-secrets
            key: oidc-client-secret
      - name: CODER_OIDC_EMAIL_DOMAIN
        value: "gmail.com"
      - name: CODER_OIDC_ALLOW_SIGNUPS
        value: "true"

pgsql-cnpg:
  name: coderdb
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  instances: 2
  storage:
    size: 10Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "7d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/coder"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: coder-cnpg-s3-secret
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: coder-cnpg-s3-secret
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: coderdb-backup
      spec:
        schedule: "0 0 2 * * *"
        backupOwnerReference: self
        immediate: true

# Push the Coder workspace templates (the Terraform directories next to this file) after every sync.
# See the "Automatic template push" section of README.md.
templatePush:
  enabled: true
  # Bitwarden secret id of a Coder API token (user with the template-admin role). Required when enabled.
  tokenBwsId: "719b6268-99cf-499f-b272-b50b00abcf4a" #gitleaks:allow #CODER_TEMPLATE_ADMIN_TOKEN
  # Coder CLI, copied into the Job. Keep the version equal to the coder chart version in Chart.yaml.
  image: ghcr.io/coder/coder:v2.39.4@sha256:2ce6b2ab5b78afe05da8b62184efc7950bb0e53a32dcefab4ef1c9b22c15631a
  # Runs the push script and the Coder API calls (needs sh, curl and jq).
  toolsImage: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
  templates:
    - name: sandbox
      dir: workspace-template
    - name: dev-workspace
      dir: workspace-template-dev-workspace
    - name: agent-workspace
      dir: workspace-template-agent-workspace
