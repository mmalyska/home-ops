pgsql-cnpg:
  name: litellmdb
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  instances: 2
  storage:
    size: 15Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # Uncomment to restore from S3 backup (requires at least one successful backup to exist):
  # bootstrap:
  #   recovery:
  #     source: litellmdb-cnpg-backup
  # externalClusters:
  #   - name: litellmdb-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: litellmdb-objectstore
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/litellm"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: litellm-secrets
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: litellm-secrets
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: litellmdb-cnpg-backup
      spec:
        immediate: true
        schedule: "5 0 0 * * *"
        backupOwnerReference: self

# Redis-compatible store for LiteLLM: keeps the provider-budget spend counters
# across pod restarts. In-namespace only, no password (ClusterIP).
dragonfly:
  name: litellm
