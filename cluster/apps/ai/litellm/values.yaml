litellm-helm:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "litellm-secrets"
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Separate metrics port without virtual-key auth; the chart's ServiceMonitor scrapes it.
  metricsServer:
    enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-stack
  masterkeySecretName: litellm-secrets
  masterkeySecretKey: LITELLM_MASTER_KEY
  environmentSecrets:
    - litellm-secrets
  proxy_config:
    model_list:
      - model_name: cheap
        litellm_params:
          model: openrouter/google/gemini-3.1-flash-lite
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: local
        litellm_params:
          model: openai/gemma-4-26b-a4b
          api_base: http://llama-server.llm.svc.cluster.local:8080/v1
          api_key: local
    litellm_settings:
      callbacks: ["prometheus"]
    router_settings:
      num_retries: 1
      # A failed deployment sits out five minutes instead of being retried on every request.
      cooldown_time: 300
      # Pay-per-token spend cap: about 50 zl as USD, review when the exchange rate moves.
      # Per provider, not litellm_settings.max_budget: that one is proxy-wide and would
      # also block `main`, which costs nothing per token. Once spent, the router skips
      # openrouter and takes the fallback. Counted in memory, so a restart resets it;
      # the prepaid OpenRouter balance is the hard ceiling.
      provider_budget_config:
        openrouter:
          budget_limit: 13
          time_period: 30d
      fallbacks:
        - cheap: ["local"]
    # Virtual keys (create with POST /key/generate, store in Bitwarden): one per client,
    # each limited to the models it needs.
    #   hermes   -> main, cheap, local
    #   honcho   -> cheap, local, embed
    #   opencode -> main, cheap, local
  db:
    deployStandalone: false
    useExisting: true
    endpoint: litellmdb-cnpg-rw
    database: app
    secret:
      name: litellmdb-cnpg-app
      usernameKey: username
      passwordKey: password
pgsql-cnpg:
  name: litellmdb
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  instances: 2
  storage:
    size: 15Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # Uncomment to restore from S3 backup (requires at least one successful backup to exist):
  # bootstrap:
  #   recovery:
  #     source: litellmdb-cnpg-backup
  # externalClusters:
  #   - name: litellmdb-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: litellmdb-objectstore
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/litellm"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: litellm-secrets
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: litellm-secrets
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: litellmdb-cnpg-backup
      spec:
        immediate: true
        schedule: "5 0 0 * * *"
        backupOwnerReference: self
