litellm-helm:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "litellm-secrets"
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  masterkeySecretName: litellm-secrets
  masterkeySecretKey: LITELLM_MASTER_KEY
  environmentSecrets:
    - litellm-secrets
  proxy_config:
    model_list:
      - model_name: cheap
        litellm_params:
          model: openrouter/google/gemini-3.1-flash-lite
          api_key: os.environ/OPENROUTER_API_KEY
      - model_name: local
        litellm_params:
          model: openai/gemma-4-26b-a4b
          api_base: http://llama-server.llm.svc.cluster.local:8080/v1
          api_key: local
  db:
    deployStandalone: false
    useExisting: true
    endpoint: litellmdb-cnpg-rw
    database: app
    secret:
      name: litellmdb-cnpg-app
      usernameKey: username
      passwordKey: password
pgsql-cnpg:
  name: litellmdb
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-standard-bookworm
  instances: 2
  storage:
    size: 15Gi
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # Uncomment to restore from S3 backup (requires at least one successful backup to exist):
  # bootstrap:
  #   recovery:
  #     source: litellmdb-cnpg-backup
  # externalClusters:
  #   - name: litellmdb-cnpg-backup
  #     plugin:
  #       name: barman-cloud.cloudnative-pg.io
  #       parameters:
  #         barmanObjectName: litellmdb-objectstore
  monitoring:
    enablePodMonitor: true
  retentionPolicy: "10d"
  objectStore:
    destinationPath: "s3://k8s-at-home-backup/cnpg/litellm"
    endpointURL: <secret:s3_endpoint>
    s3Credentials:
      accessKeyId:
        name: litellm-secrets
        key: S3_ACCESS_KEY_ID
      secretAccessKey:
        name: litellm-secrets
        key: S3_ACCESS_SECRET_KEY
  scheduledBackups:
    - name: litellmdb-cnpg-backup
      spec:
        immediate: true
        schedule: "5 0 0 * * *"
        backupOwnerReference: self
