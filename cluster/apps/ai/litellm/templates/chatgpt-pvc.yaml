# Holds auth.json for the chatgpt provider. Refresh tokens are single use, so the
# file must be writable and survive restarts; one proxy replica only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-chatgpt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
