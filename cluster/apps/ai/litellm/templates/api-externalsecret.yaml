apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: "e00e1e38-ae37-479a-8b46-b409016331eb" #gitleaks:allow #S3_ACCESS_KEY
    - secretKey: S3_ACCESS_SECRET_KEY
      remoteRef:
        key: "4d5a418c-82ed-4b8e-bfbf-b40901634ea4" #gitleaks:allow #S3_SECRET_KEY
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: "7ece641d-8f3e-42f6-b306-b45900a618ad" #gitleaks:allow #OPENROUTER_API_KEY
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: "1eb6b1b9-7dbe-4e6c-8d31-b40901588b8f" #gitleaks:allow #LITELLM_MASTER_KEY
