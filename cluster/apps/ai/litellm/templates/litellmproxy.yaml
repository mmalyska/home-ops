apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  image: ghcr.io/berriai/litellm:1.111.0@sha256:ce00096d012719d58c52cecfa373f7c6256dd1b0ff08f6fa607e10e9628f1f46
  replicas: 1
  # Admin API access for the database-backed resources (LiteLLMTeam, LiteLLMVirtualKey).
  # Models stay file-backed (applyMode default).
  apiAccess:
    masterKeyRef:
      name: litellm-secrets
      key: LITELLM_MASTER_KEY
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellmdb-cnpg-app
          key: uri
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secrets
          key: LITELLM_MASTER_KEY
    - name: LITELLM_MODE
      value: PRODUCTION
    # Read-only root: no bytecode writes, and Prisma/HOME caches go to the /tmp emptyDir.
    - name: PYTHONDONTWRITEBYTECODE
      value: "1"
    - name: HOME
      value: /tmp
    - name: CHATGPT_TOKEN_DIR
      value: /app/chatgpt_tokens
    - name: REDIS_HOST
      value: litellm-dragonfly.ai.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
  generalSettings:
    store_model_in_db: false
    health_check_endpoint: /v1/health
  litellmSettings:
    # Prometheus metrics; the Admin UI stays master-key only, never anonymous.
    success_callback: ["prometheus"]
    failure_callback: ["prometheus"]
    num_retries: 1
  routerSettings:
    # A failed deployment sits out five minutes instead of being retried on every request.
    cooldown_time: 300
    # `embed` has one backend pod (llm-embeddings, strategy Recreate) that is down for
    # 30 to 60 s whenever it rolls; a connection error surfaces as InternalServerError.
    # More retries for that model group only, so `main` and the others keep one retry
    # before their fallback chain. Retries back off up to about 8 s each (LiteLLM default).
    model_group_retry_policy:
      embed:
        InternalServerErrorRetries: 8
        TimeoutErrorRetries: 8
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    # Pay-per-token cap: about 50 zl as USD, review when the exchange rate moves.
    # Per provider, not litellm_settings.max_budget: that one is proxy-wide and would
    # also block `main`, which costs nothing per token. Counters live in Dragonfly,
    # so a restart does not reset them; the prepaid OpenRouter balance is the hard ceiling.
    provider_budget_config:
      openrouter:
        budget_limit: 13
        time_period: 30d
    fallbacks:
      # Agent tiers fail closed: each subscription tier falls to OpenRouter models
      # only, and an exhausted chain returns the last error, so an agent pauses
      # instead of working on the 1.7B Jetson model. Fallbacks chain: a fallback
      # target's own entry is used too, so the or-deepseek-* aliases must have none
      # (and main-lite must not go through `cheap`, which ends at `local`).
      # or-deepseek-v4-pro has its own daily budget (models/or-deepseek-v4-pro.yaml);
      # once it is spent, `main` continues on the flash model.
      - main: ["or-deepseek-v4-pro", "or-deepseek-v4.1-flash"]
      - main-cheap: ["or-deepseek-v4.1-flash"]
      - main-lite: ["or-deepseek-v4.1-flash"]
      # Chat and background clients (Honcho, Lingarr) may still degrade to the Jetson.
      - cheap: ["local"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  # Never calls the Kubernetes API (the operator talks to the proxy, not the other way round).
  automountServiceAccountToken: false
  # 65534 (nobody) reads the image; fsGroup makes the CephFS token volume group-writable
  # so the ChatGPT login can refresh itself.
  podSecurityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  volumeMounts:
    - name: chatgpt
      mountPath: /app/chatgpt_tokens
    - name: tmp
      mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
    - name: chatgpt
      persistentVolumeClaim:
        claimName: litellm-chatgpt
