apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
    - name: litellm
      rules:
        # budget_limit in values.yaml is 13 USD per 30d; 80% spent leaves 2.6 USD.
        - alert: LiteLLMBudgetNearlyUsed
          expr: litellm_provider_remaining_budget_metric{api_provider="openrouter"} < 2.6
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Less than 20% of the monthly OpenRouter budget is left
            description: >-
              When it runs out the gateway skips `cheap` and falls back to
              `local`. Raise budget_limit in values.yaml or wait for the reset.
        - alert: LiteLLMModelFailing
          expr: >-
            sum by (litellm_model_name) (rate(litellm_deployment_failure_responses_total[15m]))
            / sum by (litellm_model_name) (rate(litellm_deployment_total_requests_total[15m])) > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: More than half of the calls to {{ "{{ $labels.litellm_model_name }}" }} are failing
            description: >-
              For `main` this is usually the subscription usage limit or an
              expired login; the gateway is already falling back to `cheap`.
