hermes:
  replicas: 1
  image:
    repository: nousresearch/hermes-agent
    tag: "v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08"
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    # Bumped 2026-09-30: OOMKilled (exit 137) under 4 concurrent real chat
    # sessions (a corruption-rate test, not unusual production load) at the
    # old 1Gi limit -- idle baseline alone measured 609Mi. mc3 has ample
    # headroom (~28.5 GiB allocatable, ~45% used at the time), so this isn't
    # tightly budgeted like nv1's llama-server.
    limits:
      cpu: 1500m
      memory: 3Gi
  # Managed Scope: rendered to the read-only /etc/hermes/config.yaml, which beats every profile's
  # config.yaml. Holds only keys shared by every profile. A key that differs between profiles must stay out
  # of here (a managed value wins for that exact key and a managed list replaces the profile's list), so
  # model.*, memory.*, approvals.deny, toolsets, terminal.*, discord.* and kanban.* live in hermes.profileOverlays.
  # Auxiliary tasks go through the AI gateway (docs/src/k8s/ai-gateway.md): those that need quality use main
  # (subscription, no budget cap); only small background ones stay on local. Managed ${VAR} references
  # expand against the pod environment only, not a profile .env.
  config:
    approvals:
      mode: smart
    display:
      show_cost: true
    dashboard:
      show_token_analytics: true
    timezone: "Europe/Warsaw"
    # Prompt-cache routing for the ChatGPT subscription. Without a caller session id LiteLLM's chatgpt provider
    # sends a new Codex session_id on every request, so a session's calls land on different caches (main got
    # 13-21 % cache hits, 2026-11-16). With this header Hermes sends its session key on every call to the gateway
    # (matched by base_url) and LiteLLM uses it as the Codex session_id.
    providers:
      ai-gateway:
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        session_affinity_header: x-litellm-session-id
    auxiliary:
      vision:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      web_extract:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      compression:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      skills_hub:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      # The smart-approval verdict asks for reasoning_effort "none"; main's model rejects that level
      # (UnsupportedParamsError, then a fallback to cheap), main-cheap's model accepts it.
      approval:
        provider: custom
        model: main-cheap
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      mcp:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      title_generation:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      triage_specifier:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      kanban_decomposer:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      profile_describer:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      curator:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
  # Non-secret keys merged into each profile's .env at every start. A profile whose directory does not exist yet is skipped.
  profileEnv:
    default:
      TERMINAL_SSH_HOST: mmalyska-hermes-main-ssh.agent-workspaces.svc.cluster.local
      TERMINAL_SSH_USER: vscode
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/data/ssh/hermes-main.key
      TERMINAL_SSH_PERSISTENT: "true"
      # Hermes posts its own notices here (gateway online after a restart, cron store warnings, deliveries without a
      # target). Every cron job names its channel, so this only takes those notices.
      DISCORD_HOME_CHANNEL: "881886312574107758" # #hermes, a channel ID, not a secret #gitleaks:allow
    worker:
      TERMINAL_SSH_HOST: mmalyska-hermes-worker-ssh.agent-workspaces.svc.cluster.local
      TERMINAL_SSH_USER: vscode
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/data/ssh/hermes-worker.key
      TERMINAL_SSH_PERSISTENT: "true"
  # Secrets copied from the init container's environment into a profile's .env. A profile resolves ${VAR} in its config
  # from its own .env, not from the pod's environment, so a key used by a non-default profile must be listed here.
  profileSecretEnv:
    worker:
      - LITELLM_API_KEY
  # Scheduled jobs of the default profile, created at pod start and replaced when their definition here changes
  # (a paused job stays paused). A job with `script` runs that script from files/scripts/ with no model.
  # `hermes cron pause` survives a restart; merge_enabled in the merge policy is what turns merging on.
  # Jobs once declared in cronJobs and since removed: the cron seeder deletes them at start. A job left out of cronJobs
  # is otherwise kept as it is.
  retiredCronJobs:
    - kanban-post
  cronJobs:
    - name: renovate-daily
      schedule: "0 6 * * *"
      timezone: Europe/Warsaw
      skill: renovate-triage
      model: main-cheap
      deliver: "discord:1569307898860015628" # #hermes-renovate
      prompt: "Run Part A of the renovate-triage skill: start the daily Renovate run."
    # Script only, no model: posts each finished summary and merge report card of the renovate board once.
    - name: renovate-post
      schedule: "*/10 * * * *"
      timezone: Europe/Warsaw
      script: renovate-post.sh
      deliver: "discord:1569307898860015628" # #hermes-renovate
    # Script only, no model: archives done cards of the renovate board older than 14 days. Silent unless it fails.
    - name: renovate-cleanup
      schedule: "30 5 * * *"
      timezone: Europe/Warsaw
      script: renovate-cleanup.sh
      deliver: "discord:1569307898860015628" # #hermes-renovate
    # Script only, no model: sets card subscriptions to notify, and worker implement-task cards (also those that inherited
    # notify from a human parent) to notify+wake, so a card notice wakes `default` only when it has a next step or needs an
    # answer. Reads a card only for a new subscription and never runs `kanban list`. Silent unless it fails.
    - name: kanban-wake-trim
      schedule: "* * * * *"
      timezone: Europe/Warsaw
      script: kanban-wake-trim.sh
      deliver: "discord:881886312574107758" # #hermes, a channel ID, not a secret #gitleaks:allow
    # Weekly: the script lists Hermes' own edits to the skills seeded from git; the skill opens one PR with them. No
    # edit, no output: Hermes then skips the model run.
    - name: skill-sync
      schedule: "30 7 * * 1"
      timezone: Europe/Warsaw
      script: skill-sync.sh
      skill: skill-sync
      model: main
      deliver: "discord:881886312574107758" # #hermes, a channel ID, not a secret #gitleaks:allow
      prompt: "Run the skill-sync skill on the script output above."
  # Skills from skills/ take the git version unless Hermes edited the copy (its hash differs from the one recorded when it
  # was last written); an edited copy is kept and skill-sync proposes it for git. SOUL files from files/ are written over
  # the volume copy at every start.
  profileSkills:
    default:
      - renovate-triage
      - renovate-summary
      - renovate-merge
      - spec-author
      - skill-sync
    worker:
      - renovate-coordinator
      - renovate-pr-check
      - renovate-fix
      - post-merge-check
      - implement-task
  # Per-profile config overlays deep-merged on every pod start (lists are replaced):
  # `default` into /opt/data/config.yaml, any other name into /opt/data/profiles/<name>/config.yaml.
  # Profiles themselves are created imperatively; overlays for profiles that do not exist yet are skipped.
  # Deny rules are case-insensitive fnmatch globs matched against whole commands and each executable
  # candidate; `*` crosses spaces, and `git *push*` also covers `git -C <dir> push`. They are a policy,
  # not a sandbox (bare `git push` on the protected branch is caught by the GitHub ruleset, not here).
  profileOverlays:
    default:
      # Everything goes through the AI gateway: the gateway holds the provider credentials, picks the
      # fallback (main, cheap, local) and enforces the budget, so Hermes keeps no provider key and no
      # fallback_providers. LITELLM_API_KEY is the hermes team key (Secret hermes-litellm). Hermes rejects
      # any model below 64K context; local is served with -c 262144 -np 2 (131072 per slot). context_length is main's usable
      # window (272K at the gateway) with headroom, so compression does not start at 32K.
      model:
        provider: custom
        default: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
        context_length: 200000
        # LiteLLM loses the arguments of parallel tool calls in a streamed response (tested 2026-11-13 on v1.109.1).
        # Hermes then gets empty tool calls; unstreamed responses arrive intact.
        streaming: false
      memory:
        provider: honcho
      # The #hermes channel session lives until /new, and every chat turn and kanban wake replays it. With the
      # 0.75 floor Hermes applies below a 512K window, compression would start only at 150K (session averaged
      # 92K per call, 2026-11-16); threshold_tokens is applied after that floor. Idle compaction shrinks a
      # session that resumes after 30 minutes before the first reply (skipped when it is already small).
      compression:
        threshold_tokens: 100000
        idle_compact_after_seconds: 1800
      terminal:
        backend: ssh
        cwd: /workspaces
        # A foreground command otherwise stops early unless the agent passes a timeout itself.
        timeout: 600
      discord:
        require_mention: true
        # Comma-separated string, documented form: #hermes, #hermes-renovate.
        free_response_channels: "881886312574107758,1569307898860015628"
        auto_thread: true
      kanban:
        orchestrator_profile: default
        default_assignee: worker
        # default runs the summary, merge and report cards of the renovate board.
        dispatch_profiles:
          - worker
          - default
        max_in_progress_per_profile: 2
        # A card created from a Discord chat subscribes that chat (thread included) to its terminal events, and the cards
        # created from it copy the subscription: a block or a finished card posts in that thread and wakes the agent there.
        # The job kanban-wake-trim keeps the wake only on worker implement-task cards; other cards post the notice only.
        # Cards started by cron or by the dispatcher have no chat, so the daily Renovate run posts nothing this way;
        # renovate-post posts its summaries. No per-board or per-status wake switch exists (checked v0.23.1 and upstream
        # main, 2026-11-16).
        auto_subscribe_on_create: true
      # Kanban tools are opt-in per platform. Saving a list for Discord also turns on the Discord tools. spec-author needs
      # the `discord` set for create_thread; the admin set stays disabled.
      platform_toolsets:
        discord:
          - hermes-discord
          - kanban
        cron:
          - hermes-cron
          - kanban
        # Cards started by the dispatcher run on the cli platform.
        cli:
          - terminal
          - kanban
          - skills
          - todo
      agent:
        disabled_toolsets:
          - discord_admin
          - file
          # No text-to-speech: without a tts section Hermes falls back to Edge TTS, a cloud
          # service outside the AI gateway. Applied after platform_toolsets, so the
          # hermes-discord and hermes-cron bundles lose it too.
          - tts
          # Not used by any seeded skill; 4 tools and about 15 KB of tool schemas on every Discord and cron call
          # (prompt-size, 2026-11-16). `browser` is the static toolset and covers every core browser_* tool;
          # browser_exec registers under `browser-use`, which disables only that one tool.
          - browser
          - connections
          - delegation
          - code_execution
      approvals:
        deny:
          - "git *push*--force*"
          - "git *push* -f"
          - "git *push* -f *"
          - "git *push* +*"
          - "git *push*[ :]main"
          - "git *push*[ :]main *"
          - "git *push*[ :]master"
          - "git *push*[ :]master *"
          - "git *push*refs/heads/main"
          - "git *push*refs/heads/main *"
          - "git *push*refs/heads/master"
          - "git *push*refs/heads/master *"
          - "kubectl apply*"
          - "kubectl * apply *"
          - "kubectl delete*"
          - "kubectl * delete *"
          - "kubectl patch*"
          - "kubectl * patch *"
          - "kubectl exec*"
          - "kubectl * exec *"
    worker:
      model:
        provider: custom
        default: main-cheap
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
        context_length: 200000
        # LiteLLM loses the arguments of parallel tool calls in a streamed response (tested 2026-11-13 on v1.109.1).
        # Hermes then gets empty tool calls; unstreamed responses arrive intact.
        streaming: false
      # No long-term memory: worker tasks are self-contained (spec, worker memory decision).
      memory:
        provider: ""
        memory_enabled: false
        user_profile_enabled: false
      terminal:
        backend: ssh
        cwd: /workspaces
      # Dispatcher-spawned kanban workers run on the cli platform, so this list is what they get.
      platform_toolsets:
        cli:
          - terminal
          - web
          - kanban
          - skills
          - todo
          - clarify
      # Applied last, so these stay off even if a platform selection names them.
      agent:
        disabled_toolsets:
          - memory
          - cronjob
          - delegation
          - discord
          - file
          - tts
      approvals:
        deny:
          - "git *push*--force*"
          - "git *push* -f"
          - "git *push* -f *"
          - "git *push* +*"
          - "git *push*[ :]main"
          - "git *push*[ :]main *"
          - "git *push*[ :]master"
          - "git *push*[ :]master *"
          - "git *push*refs/heads/main"
          - "git *push*refs/heads/main *"
          - "git *push*refs/heads/master"
          - "git *push*refs/heads/master *"
          - "kubectl apply*"
          - "kubectl * apply *"
          - "kubectl delete*"
          - "kubectl * delete *"
          - "kubectl patch*"
          - "kubectl * patch *"
          - "kubectl exec*"
          - "kubectl * exec *"
          - "gh pr merge*"
          - "gh pr review*"
          - "gh api*merge*"
          - "gh api*-X PUT*"
          - "gh api*--method PUT*"
          - "gh api*-X DELETE*"
          - "gh api*--method DELETE*"
          - "argocd app sync*"

externalSecrets:
  - secretName: DISCORD_BOT_TOKEN
    bwsId: "be7ed9dc-3301-4c8b-adcd-b45600ea8816" #gitleaks:allow #HERMES_DISCORD_BOT_TOKEN
  - secretName: DISCORD_ALLOWED_USERS
    bwsId: "17384da9-0339-44a9-b322-b45600eaaf2b" #gitleaks:allow #HERMES_DISCORD_ALLOWED_USERS
  # fileOnly: mounted only into the ssh-key-seeder init container, never an environment variable of the pod.
  - secretName: HERMES_MAIN_WS_SSH_KEY
    bwsId: "de8d4af8-10f2-46a0-81f4-b4fd00b76c12" #gitleaks:allow #HERMES_MAIN_WS_SSH_KEY
    fileOnly: true
  - secretName: HERMES_WORKER_WS_SSH_KEY
    bwsId: "3e74a610-c2bd-4c8d-b2eb-b4fd00b79c2a" #gitleaks:allow #HERMES_WORKER_WS_SSH_KEY
    fileOnly: true

backup:
  schedule: "0 */6 * * *"
  retention:
    daily: 6
    weekly: 4
    monthly: 2
