hermes:
  replicas: 1
  image:
    repository: nousresearch/hermes-agent
    tag: "v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002"
  resources:
    requests:
      cpu: 200m
      memory: 768Mi
    # Bumped 2026-09-30: OOMKilled (exit 137) under 4 concurrent real chat
    # sessions (a corruption-rate test, not unusual production load) at the
    # old 1Gi limit -- idle baseline alone measured 609Mi. mc3 has ample
    # headroom (~28.5 GiB allocatable, ~45% used at the time), so this isn't
    # tightly budgeted like nv1's llama-server.
    limits:
      cpu: 1500m
      memory: 3Gi
  # Managed Scope: rendered to the read-only /etc/hermes/config.yaml, which beats every profile's
  # config.yaml. Holds only keys shared by every profile. A key that differs between profiles must stay out
  # of here (a managed value wins for that exact key and a managed list replaces the profile's list), so
  # model.*, memory.*, approvals.deny, toolsets, terminal.*, discord.* and kanban.* live in hermes.profileOverlays.
  # Auxiliary tasks go through the AI gateway (docs/src/k8s/ai-gateway.md): those that need quality use main
  # (subscription, no budget cap); only small background ones stay on local. Managed ${VAR} references
  # expand against the pod environment only, not a profile .env.
  config:
    approvals:
      mode: smart
    display:
      show_cost: true
    dashboard:
      show_token_analytics: true
    tts:
      provider: piper
      piper:
        voice: en_US-lessac-medium
    timezone: "Europe/Warsaw"
    auxiliary:
      vision:
        provider: custom
        model: local-think
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      web_extract:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      compression:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      skills_hub:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      approval:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      mcp:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      title_generation:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      triage_specifier:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      kanban_decomposer:
        provider: custom
        model: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      profile_describer:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
      curator:
        provider: custom
        model: local
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
  # Non-secret keys merged into each profile's .env at every start. A profile whose directory does not exist yet is skipped.
  profileEnv:
    default:
      TERMINAL_SSH_HOST: mmalyska-hermes-main-ssh.agent-workspaces.svc.cluster.local
      TERMINAL_SSH_USER: vscode
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/data/ssh/hermes-main.key
      TERMINAL_SSH_PERSISTENT: "true"
      DISCORD_HOME_CHANNEL: "1569307898860015628" # #hermes-renovate
    worker:
      TERMINAL_SSH_HOST: mmalyska-hermes-worker-ssh.agent-workspaces.svc.cluster.local
      TERMINAL_SSH_USER: vscode
      TERMINAL_SSH_PORT: "22"
      TERMINAL_SSH_KEY: /opt/data/ssh/hermes-worker.key
      TERMINAL_SSH_PERSISTENT: "true"
  # Secrets copied from the init container's environment into a profile's .env. A profile resolves ${VAR} in its config
  # from its own .env, not from the pod's environment, so a key used by a non-default profile must be listed here.
  profileSecretEnv:
    worker:
      - LITELLM_API_KEY
  # Scheduled jobs of the default profile, created at pod start and replaced when their definition here changes.
  # `hermes cron pause` survives a restart; merge_enabled in the merge policy is what turns merging on.
  cronJobs:
    - name: renovate-daily
      schedule: "0 6 * * *"
      timezone: Europe/Warsaw
      skill: renovate-triage
      model: main-cheap
      deliver: "discord:1569307898860015628" # #hermes-renovate
      prompt: "Run Part A of the renovate-triage skill: the daily Renovate run."
  # Skills and SOUL files from skills/ and files/, written over the copies on the volume at every start.
  profileSkills:
    default:
      - renovate-triage
      - spec-author
    worker:
      - renovate-pr-check
      - renovate-fix
      - post-merge-check
      - implement-task
  # Per-profile config overlays deep-merged on every pod start (lists are replaced):
  # `default` into /opt/data/config.yaml, any other name into /opt/data/profiles/<name>/config.yaml.
  # Profiles themselves are created imperatively; overlays for profiles that do not exist yet are skipped.
  # Deny rules are case-insensitive fnmatch globs matched against whole commands and each executable
  # candidate; `*` crosses spaces, and `git *push*` also covers `git -C <dir> push`. They are a policy,
  # not a sandbox (bare `git push` on the protected branch is caught by the GitHub ruleset, not here).
  profileOverlays:
    default:
      # Everything goes through the AI gateway: the gateway holds the provider credentials, picks the
      # fallback (main, cheap, local) and enforces the budget, so Hermes keeps no provider key and no
      # fallback_providers. LITELLM_API_KEY is the hermes team key (Secret hermes-litellm). Hermes rejects
      # any model below 64K context; local is served with -c 65536 -np 1. context_length is main's usable
      # window (272K at the gateway) with headroom, so compression does not start at 32K.
      model:
        provider: custom
        default: main
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
        context_length: 200000
      memory:
        provider: honcho
      terminal:
        backend: ssh
        cwd: /workspaces
        # A foreground command otherwise stops early unless the agent passes a timeout itself.
        timeout: 600
      discord:
        require_mention: true
        # Comma-separated string, documented form: #hermes, #hermes-renovate.
        free_response_channels: "881886312574107758,1569307898860015628"
        auto_thread: true
      kanban:
        orchestrator_profile: default
        default_assignee: worker
        dispatch_profiles:
          - worker
        max_in_progress_per_profile: 2
      # Kanban tools are opt-in per platform. Saving a list for Discord also turns on the Discord tools. spec-author needs
      # the `discord` set for create_thread; the admin set stays disabled.
      platform_toolsets:
        discord:
          - hermes-discord
          - kanban
        cron:
          - hermes-cron
          - kanban
      agent:
        disabled_toolsets:
          - discord_admin
          - file
      approvals:
        deny:
          - "git *push*--force*"
          - "git *push* -f"
          - "git *push* -f *"
          - "git *push* +*"
          - "git *push*[ :]main"
          - "git *push*[ :]main *"
          - "git *push*[ :]master"
          - "git *push*[ :]master *"
          - "git *push*refs/heads/main"
          - "git *push*refs/heads/main *"
          - "git *push*refs/heads/master"
          - "git *push*refs/heads/master *"
          - "kubectl apply*"
          - "kubectl * apply *"
          - "kubectl delete*"
          - "kubectl * delete *"
          - "kubectl patch*"
          - "kubectl * patch *"
          - "kubectl exec*"
          - "kubectl * exec *"
    worker:
      model:
        provider: custom
        default: main-cheap
        base_url: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: ${LITELLM_API_KEY}
        context_length: 200000
      # No long-term memory: worker tasks are self-contained (spec, worker memory decision).
      memory:
        provider: ""
        memory_enabled: false
        user_profile_enabled: false
      terminal:
        backend: ssh
        cwd: /workspaces
      # Dispatcher-spawned kanban workers run on the cli platform, so this list is what they get.
      platform_toolsets:
        cli:
          - terminal
          - web
          - kanban
          - skills
          - todo
          - clarify
      # Applied last, so these stay off even if a platform selection names them.
      agent:
        disabled_toolsets:
          - memory
          - cronjob
          - delegation
          - discord
          - file
      approvals:
        deny:
          - "git *push*--force*"
          - "git *push* -f"
          - "git *push* -f *"
          - "git *push* +*"
          - "git *push*[ :]main"
          - "git *push*[ :]main *"
          - "git *push*[ :]master"
          - "git *push*[ :]master *"
          - "git *push*refs/heads/main"
          - "git *push*refs/heads/main *"
          - "git *push*refs/heads/master"
          - "git *push*refs/heads/master *"
          - "kubectl apply*"
          - "kubectl * apply *"
          - "kubectl delete*"
          - "kubectl * delete *"
          - "kubectl patch*"
          - "kubectl * patch *"
          - "kubectl exec*"
          - "kubectl * exec *"
          - "gh pr merge*"
          - "gh pr review*"
          - "gh api*merge*"
          - "gh api*-X PUT*"
          - "gh api*--method PUT*"
          - "gh api*-X DELETE*"
          - "gh api*--method DELETE*"
          - "argocd app sync*"

externalSecrets:
  - secretName: DISCORD_BOT_TOKEN
    bwsId: "be7ed9dc-3301-4c8b-adcd-b45600ea8816" #gitleaks:allow #HERMES_DISCORD_BOT_TOKEN
  - secretName: DISCORD_ALLOWED_USERS
    bwsId: "17384da9-0339-44a9-b322-b45600eaaf2b" #gitleaks:allow #HERMES_DISCORD_ALLOWED_USERS
  # fileOnly: mounted only into the ssh-key-seeder init container, never an environment variable of the pod.
  - secretName: HERMES_MAIN_WS_SSH_KEY
    bwsId: "de8d4af8-10f2-46a0-81f4-b4fd00b76c12" #gitleaks:allow #HERMES_MAIN_WS_SSH_KEY
    fileOnly: true
  - secretName: HERMES_WORKER_WS_SSH_KEY
    bwsId: "3e74a610-c2bd-4c8d-b2eb-b4fd00b79c2a" #gitleaks:allow #HERMES_WORKER_WS_SSH_KEY
    fileOnly: true

backup:
  schedule: "0 */6 * * *"
  retention:
    daily: 6
    weekly: 4
    monthly: 2
