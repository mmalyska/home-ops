apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  annotations:
    secret.reloader.stakater.com/reload: "hermes-agent-secrets,hermes-litellm"
  namespace: hermes-agent
spec:
  replicas: {{ .Values.hermes.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
      annotations:
        checksum/config:
          {{include (print $.Template.BasePath "/configmap.yaml") . | sha256sum}}
        checksum/profile-overlays:
          {{include (print $.Template.BasePath "/profile-overlays-configmap.yaml") . | sha256sum}}
    spec:
      initContainers:
        - name: fix-kanban-db-permissions
          image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - sh
            - -c
            - |
              find /opt/data -name 'kanban.db*' | while read f; do
                chown 10000:10000 "$f" && chmod 644 "$f" || true
              done
          volumeMounts:
            - name: data
              mountPath: /opt/data
        - name: ssh-key-seeder
          image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/data/ssh
              cp /run/ssh-keys/HERMES_MAIN_WS_SSH_KEY /opt/data/ssh/hermes-main.key
              cp /run/ssh-keys/HERMES_WORKER_WS_SSH_KEY /opt/data/ssh/hermes-worker.key
              rm -f /opt/data/ssh/sandbox-devops.key
              chown 10000:10000 /opt/data/ssh /opt/data/ssh/*.key
              chmod 700 /opt/data/ssh
              chmod 600 /opt/data/ssh/*.key
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: workspace-ssh-keys
              mountPath: /run/ssh-keys
        - name: honcho-seeder
          image: "{{ .Values.hermes.image.repository }}:{{ .Values.hermes.image.tag }}"
          command:
            - python3
            - -c
            - |
              import json, os

              template_path = '/honcho-config/honcho.json'

              with open(template_path) as f:
                  overrides = json.load(f)

              # Write to $HERMES_HOME/honcho.json (primary read path for default profile)
              hermes_home = os.environ.get('HERMES_HOME', '/opt/data')
              target_path = os.path.join(hermes_home, 'honcho.json')

              if os.path.exists(target_path):
                  with open(target_path) as f:
                      config = json.load(f) or {}

                  def deep_merge(base, src):
                      for k, v in src.items():
                          if isinstance(v, dict) and isinstance(base.get(k), dict):
                              deep_merge(base[k], v)
                          else:
                              base[k] = v

                  deep_merge(config, overrides)
              else:
                  config = overrides

              with open(target_path, 'w') as f:
                  json.dump(config, f, indent=2)

              # Seed honcho.json to profile directories, which read it from
              # $HERMES_HOME/honcho.json (/opt/data/profiles/<name>/honcho.json).
              # The worker profile has no long-term memory, so it gets none.
              no_honcho_profiles = {'worker'}
              profiles_dir = os.path.join(hermes_home, 'profiles')
              if os.path.isdir(profiles_dir):
                  for profile in os.listdir(profiles_dir):
                      if profile in no_honcho_profiles:
                          continue
                      profile_target = os.path.join(profiles_dir, profile, 'honcho.json')
                      if not os.path.exists(profile_target):
                          with open(profile_target, 'w') as f:
                              json.dump(config, f, indent=2)

          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: honcho-config
              mountPath: /honcho-config
          env:
            - name: HERMES_HOME
              value: /opt/data
        - name: profile-config-seeder
          image: "{{ .Values.hermes.image.repository }}:{{ .Values.hermes.image.tag }}"
          command:
            - /opt/hermes/.venv/bin/python
            - -c
            - |
              import os
              import sys

              import hermes_yaml as yaml

              # Deep-merges per-profile overlays (ConfigMap files named <profile>.yaml) into
              # <HERMES_HOME>/profiles/<profile>/config.yaml, and the overlay named `default`
              # into <HERMES_HOME>/config.yaml (the default profile has no directory under
              # profiles/). Profiles are created imperatively inside the pod, so a missing
              # profile directory is skipped; a missing default config.yaml is created.
              overlay_dir = os.environ.get('OVERLAY_DIR', '/profile-overlays')
              hermes_home = os.environ.get('HERMES_HOME', '/opt/data')
              profiles_dir = os.path.join(hermes_home, 'profiles')


              def deep_merge(base, src):
                  for k, v in src.items():
                      if isinstance(v, dict) and isinstance(base.get(k), dict):
                          deep_merge(base[k], v)
                      else:
                          base[k] = v


              for fname in sorted(os.listdir(overlay_dir)):
                  if not fname.endswith('.yaml'):
                      continue
                  profile = fname[:-len('.yaml')]
                  if profile == 'default':
                      target = os.path.join(hermes_home, 'config.yaml')
                  else:
                      target = os.path.join(profiles_dir, profile, 'config.yaml')
                  if profile != 'default' and not os.path.isfile(target):
                      print(f'skip {profile}: {target} not found', file=sys.stderr)
                      continue
                  with open(os.path.join(overlay_dir, fname)) as f:
                      overrides = yaml.safe_load(f) or {}
                  config = {}
                  if os.path.isfile(target):
                      with open(target) as f:
                          config = yaml.safe_load(f) or {}
                  deep_merge(config, overrides)
                  with open(target, 'w') as f:
                      yaml.safe_dump(config, f, default_flow_style=False, allow_unicode=True, sort_keys=False)
                  print(f'merged overlay into {target}')
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: PYTHONPATH
              value: /opt/hermes
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: profile-overlays
              mountPath: /profile-overlays
        - name: profile-env-seeder
          image: alpine:3@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - sh
            - -c
            - |
              set -eu
              {{- range $profile, $env := .Values.hermes.profileEnv }}
              {{- $dir := ternary "/opt/data" (printf "/opt/data/profiles/%s" $profile) (eq $profile "default") }}
              if [ -d {{ $dir | squote }} ]; then
                f={{ printf "%s/.env" $dir | squote }}
                touch "$f"
                if [ -s "$f" ] && [ -n "$(tail -c 1 "$f")" ]; then echo >> "$f"; fi
                {{- range $key, $value := $env }}
                sed -i '/^{{ $key }}=/d' "$f"
                printf '%s=%s\n' {{ $key | squote }} {{ $value | toString | squote }} >> "$f"
                {{- end }}
                {{- range (index $.Values.hermes.profileSecretEnv $profile | default list) }}
                sed -i '/^{{ . }}=/d' "$f"
                printf '%s=%s\n' {{ . | squote }} "${{ . }}" >> "$f"
                {{- end }}
                chown 10000:10000 "$f"
                chmod 600 "$f"
              else
                echo {{ printf "skip %s: profile directory not found" $profile | squote }}
              fi
              {{- end }}
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-litellm
                  key: key
          volumeMounts:
            - name: data
              mountPath: /opt/data
      containers:
        - name: hermes-agent
          image: "{{ .Values.hermes.image.repository }}:{{ .Values.hermes.image.tag }}"
          args:
            - gateway
            - run
            - --replace
          env:
            - name: HOME
              value: /opt/data
            - name: HERMES_DASHBOARD
              value: "true"
            - name: HERMES_DASHBOARD_TUI
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "127.0.0.1"
            - name: HERMES_DASHBOARD_PORT
              value: "9120"
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-litellm
                  key: key
            {{- range .Values.externalSecrets }}
            {{- if not .fileOnly }}
            - name: {{ if .envName }}{{ .envName }}{{ else }}{{ .secretName }}{{ end }}
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: {{ .secretName }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 9120
              protocol: TCP
          resources: {{toYaml .Values.hermes.resources | nindent 12}}
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Managed Scope, single file: the image already keeps other files in /etc/hermes.
            - name: managed-config
              mountPath: /etc/hermes/config.yaml
              subPath: config.yaml
              readOnly: true
        - name: nginx
          image: nginx:1.31-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: managed-config
          configMap:
            name: hermes-agent-config
        - name: nginx-config
          configMap:
            name: hermes-agent-nginx
        - name: honcho-config
          configMap:
            name: hermes-agent-honcho
        - name: profile-overlays
          configMap:
            name: hermes-agent-profile-overlays
        - name: workspace-ssh-keys
          secret:
            secretName: hermes-agent-secrets
            items:
              - key: HERMES_MAIN_WS_SSH_KEY
                path: HERMES_MAIN_WS_SSH_KEY
              - key: HERMES_WORKER_WS_SSH_KEY
                path: HERMES_WORKER_WS_SSH_KEY
