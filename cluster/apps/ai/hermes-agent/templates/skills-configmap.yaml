apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-skills
  namespace: hermes-agent
data:
{{- range $path, $_ := .Files.Glob "skills/*/SKILL.md" }}
  {{ base (dir $path) }}.md: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- /* A skill's reference files: key ref-<skill>--<file>, written to skills/<skill>/references/<file>. */}}
{{- range $path, $_ := .Files.Glob "skills/*/references/*" }}
  ref-{{ base (dir (dir $path)) }}--{{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/soul-*.md" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/scripts/*" }}
  script-{{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
