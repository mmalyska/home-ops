- enabled: "true"
  namespace: ollama
  syncPolicy:
    # TEMPORARY: auto-sync paused while the llama.cpp engine spike borrows nv1's
    # single GPU (Ollama is scaled to 0). Revert to `true` when the spike ends.
    enabled: false
    selfHeal: true
    prune: false
  plugin:
    env:
      - name: SECRET_PROVIDER
        value: cluster-secrets
