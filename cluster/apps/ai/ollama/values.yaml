ollama:
  # Scaled to 0 so llama-server can take the single nvidia.com/gpu unit on nv1.
  # Ollama is retired once the local-first cutover is verified.
  replicaCount: 0
  image:
    tag: "0.20.5@sha256:8ab27f32210327a04fb98f6e53fba5d19a9d632777455389d48724028434a9f0" # >=0.20.5 for the JetPack 6 CUDA backend (upstream Bug 19)
  ollama:
    models:
      pull:
        - qwen3.5:9b
        - nomic-embed-text
  extraEnv:
    - name: JETSON_JETPACK
      value: "6"
    - name: OLLAMA_KV_CACHE_TYPE
      value: "q4_0"
    - name: OLLAMA_NUM_PARALLEL
      value: "1"
    - name: OLLAMA_NUM_GPU
      value: "-1"
    - name: OLLAMA_FLASH_ATTENTION
      value: "1"
    - name: OLLAMA_CONTEXT_LENGTH
      value: "16384"
  nodeSelector:
    accelerator: jetson-orin
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  service:
    type: ClusterIP
  ingress:
    enabled: false
  persistentVolume:
    enabled: true
    size: "40Gi"
  resources:
    limits:
      nvidia.com/gpu: 1
      memory: 13Gi
    requests:
      nvidia.com/gpu: 1
      cpu: 100m
      memory: 8Gi
