# Only the gateway calls the embeddings server. The Jetson's llama-server is
# deliberately left without a policy (owner decision: nothing on the Jetson is
# changed).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llm-embeddings
  namespace: llm
spec:
  podSelector:
    matchLabels:
      app: llm-embeddings
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 8080
          protocol: TCP
