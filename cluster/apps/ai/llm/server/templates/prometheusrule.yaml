apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: llama-server
  namespace: llm
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
    - name: llama-server
      rules:
        - alert: LlamaServerUnavailable
          expr: kube_deployment_status_replicas_available{namespace="llm",deployment="llama-server"} < 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: llama-server has no available replica
            description: >-
              Honcho falls back to its cloud models and Hermes' local auxiliary
              tasks fall back to the main (cloud) model while this is down. Check GPU registration (NodeGpuUnavailable), the model PVC
              and the pod logs.
        # llamacpp:predicted_tokens_seconds is an average since pod start that
        # keeps its value while idle and drops with concurrent slots, so it
        # false-fires on a healthy GPU. CPU use separates the cases: about
        # 0.2-1.2 cores on the GPU, about 7 cores on CPU fallback.
        - alert: LlamaServerOnCpu
          expr: >-
            rate(container_cpu_usage_seconds_total{namespace="llm",container="llama-server"}[5m]) > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: llama-server is burning CPU, probably running on CPU instead of the GPU
            description: >-
              A healthy GPU run uses about 0.2-1.2 cores; CPU fallback (usually
              a CUDA 13 image or a lost GPU) is about 7 cores at about 6 tok/s.
              Check the startup log for ggml_cuda_init errors.
