apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llm
spec:
  replicas: {{ .Values.server.replicaCount }}
  # The single GPU unit cannot be held by two pods: never start the new one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      nodeSelector:
        accelerator: jetson-orin
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      initContainers:
        - name: fetch-model
          image: {{ .Values.server.fetchImage }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              # fetch FILE URL SHA256 SIZE
              fetch() {
                DEST="/models/$1"
                # Skip the network entirely when a previously verified file exists
                # (lets the pod restart while offline).
                if [ -f "${DEST}.ok" ] && [ "$(cat "${DEST}.ok")" = "$3" ] \
                   && [ "$(stat -c %s "${DEST}")" = "$4" ]; then
                  echo "$1 present and verified; skipping download"
                  return 0
                fi
                echo "downloading $2"
                wget -c -O "${DEST}.part" "$2"
                echo "$3  ${DEST}.part" | sha256sum -c -
                mv "${DEST}.part" "${DEST}"
                echo "$3" > "${DEST}.ok"
              }
              fetch "${MODEL_FILE}" "${MODEL_URL}" "${MODEL_SHA256}" "${MODEL_SIZE}"
              {{- with .Values.server.mmproj }}
              fetch "${MMPROJ_FILE}" "${MMPROJ_URL}" "${MMPROJ_SHA256}" "${MMPROJ_SIZE}"
              {{- end }}
          env:
            - name: MODEL_FILE
              value: {{ .Values.server.model.file | quote }}
            - name: MODEL_URL
              value: {{ .Values.server.model.url | quote }}
            - name: MODEL_SHA256
              value: {{ .Values.server.model.sha256 | quote }}
            - name: MODEL_SIZE
              value: {{ .Values.server.model.size | quote }}
            {{- with .Values.server.mmproj }}
            - name: MMPROJ_FILE
              value: {{ .file | quote }}
            - name: MMPROJ_URL
              value: {{ .url | quote }}
            - name: MMPROJ_SHA256
              value: {{ .sha256 | quote }}
            - name: MMPROJ_SIZE
              value: {{ .size | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          command: ["llama-server"]
          args:
            - -m
            - /models/{{ .Values.server.model.file }}
            {{- with .Values.server.mmproj }}
            # Vision projector for a multimodal model (images, video frames).
            - --mmproj
            - /models/{{ .file }}
            {{- end }}
            - --alias
            - {{ .Values.server.model.alias }}
            # Short flags as verified on this image (llama.cpp v0.8.0, CUDA 13).
            - -ngl
            - "99"
            - -fa
            - "on"
            - -ctk
            - {{ .Values.server.kvCache.k | quote }}
            - -ctv
            - {{ .Values.server.kvCache.v | quote }}
            - -c
            - {{ .Values.server.ctx | quote }}
            - -np
            - {{ .Values.server.parallel | quote }}
            - --jinja
            # Default chat template kwargs (values.yaml); a request can override
            # them with chat_template_kwargs.
            - --chat-template-kwargs
            - {{ .Values.server.chatTemplateKwargs | default "{}" | quote }}
            - --reasoning-budget
            - {{ .Values.server.reasoningBudget | quote }}
            # nv1 shares 15.6 GiB of unified memory with the system. The host-RAM
            # prompt cache defaults to 8 GiB and there are 32 context checkpoints
            # per slot, which starved the node into global OOM with the old 26B
            # model. Cap both.
            - --cache-ram
            - {{ .Values.server.cacheRam | quote }}
            - --ctx-checkpoints
            - {{ .Values.server.ctxCheckpoints | quote }}
            {{- with .Values.server.nPredict }}
            # Per-request generation cap; see values.yaml (runaway on a single slot).
            - --n-predict
            - {{ . | quote }}
            {{- end }}
            - -ub
            - {{ .Values.server.ubatch | quote }}
            {{- with .Values.server.sampling }}
            # Server-side sampling defaults; a request that sets its own value wins.
            {{- with .temp }}
            - --temp
            - {{ . | quote }}
            {{- end }}
            {{- with .topK }}
            - --top-k
            - {{ . | quote }}
            {{- end }}
            {{- with .repeatPenalty }}
            - --repeat-penalty
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            - --metrics
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Cold start loads the model from Ceph (~2 GB for LFM3, ~10.5 GB was Gemma); allow up to 10 min.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources: {{ toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-server-models
