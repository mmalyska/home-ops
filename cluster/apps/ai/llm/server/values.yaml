server:
  replicaCount: 1
  image:
    # Our own build (mmalyska/containers), not NVIDIA's stale nvidia-ai-iot
    # image: b8708 predates the LFM2 tool-call double-escaping fix (b9660,
    # 2026-06-16) and the think-tag leak fix (ggml-org/llama.cpp#24234). This
    # tag tracks upstream llama.cpp releases (ci/latest.sh) on top of the same
    # proven-good JetPack6/r36.4/CUDA12.6/Orin(sm_87) base NVIDIA publishes.
    # NEVER use *-cu129 anything on nv1 (CUDA 13/12.9 does not initialize on
    # this driver and silently falls back to CPU).
    repository: ghcr.io/mmalyska/llama-cpp-jetson
    tag: "v0.7.0@sha256:35a92c8eff48d19996ab6f32bd7e3da9ffb575c279f170531474429b8bb03ca9"
  fetchImage: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  model:
    file: gemma-4-26B-A4B-it-UD-Q2_K_XL.gguf
    url: https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q2_K_XL.gguf
    sha256: 2a1d26dfe6ea00a467940a5728316af6edb366bbdba950d65b85d232392fb658
    size: "10546934240"
    alias: gemma-4-26b-a4b
  # One slot of 65536 tokens. Hermes hard-refuses a model with less than
  # 64,000 tokens of context (agent_init._enforce_minimum_context), so each slot
  # needs >= 64000; ctx / parallel = 65536 here. Why one slot and not two:
  # 2 x 64K needs -c 131072, the config that OOM-killed Gemma at 13.78 GB under
  # concurrent turns on 2026-09-28. Why Gemma at all: LFM2.5's hybrid
  # recurrent state corrupts multi-turn output (llama.cpp#29002, still open;
  # measured 29.0% under real Hermes traffic). Gemma 4 has no recurrent state:
  # 0 corrupt turns of 66 multi-turn tool-calling turns on 2026-10-15
  # (95% upper bound ~4.5%). See docs/superpowers/plans/2026-10-13-llm-reliability-gemma4.md.
  # Consequence: requests from concurrent sessions are served one at a time.
  ctx: 65536
  parallel: 1
  # Gemma 4 thinks by default and the reasoning consumes max_tokens, so
  # small-budget calls (titles, Honcho deriver) return empty content. Default
  # it off; a request can turn it back on with chat_template_kwargs.enable_thinking=true.
  chatTemplateKwargs: '{"enable_thinking":false}'
  # The chart always renders --reasoning-budget; -1 is "unrestricted". (0 breaks
  # the reasoning-content parser on this build, as found with LFM2.5.)
  reasoningBudget: -1
  # Hard cap on tokens generated per request that does not set max_tokens
  # (Hermes and Lingarr send none). On one slot a single runaway generation
  # blocks every session until it reaches the context limit (about an hour at
  # 14 tok/s); at 16384 it costs ~19 minutes. It was 2048 (~2 minutes), verified
  # to stop at exactly 2048 with finish_reason=length, until Lingarr: it sends a
  # whole subtitle file as one batch, ~25 output tokens per cue, so 357 cues need
  # ~9K tokens and a 2048 cap truncated the JSON on every retry. Keep the cap
  # below Bazarr's 32 minute Lingarr timeout (~28K tokens).
  nPredict: 16384
  # Memory budget on nv1 (15.6 GiB unified, ~3.4 GiB used by the system). The
  # pod itself sits at ~10.5-10.9 GiB, but GPU allocations are not charged to
  # its cgroup: watch NODE MemAvailable (steady ~0.86 GB, transient low ~0.54 GB
  # after a fresh start; accepted by the owner 2026-10-15), not `kubectl top`.
  # One saved prompt state is ~276 MiB. 256 MiB rejects every entry, so
  # sessions that alternate re-prefill ~16K tokens on every call. 640 MiB holds
  # two states = two interleaved sessions: measured 3-4x faster turns (no-tool
  # 48-51 s -> 12-18 s). It does NOT help 3+ sessions (cyclic eviction, no gain,
  # 0.48 GB dip) and nothing the node can afford does. Do not raise it further.
  cacheRam: 640 # MiB of host-RAM prompt cache
  ctxCheckpoints: 2 # per slot; each ~81 MiB
  ubatch: 256 # physical batch; halves the compute buffer vs the 512 default
  storage: 30Gi
  resources:
    requests:
      cpu: 500m
      memory: 9Gi
    # Tested at 13Gi. Keep it under the ~13.4 GiB point where the node itself
    # starves, so a runaway kills this pod and not cilium-envoy / node-exporter.
    limits:
      memory: 13Gi
      nvidia.com/gpu: 1
