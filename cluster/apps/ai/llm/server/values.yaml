server:
  replicaCount: 1
  image:
    # Our own build (mmalyska/containers), not NVIDIA's stale nvidia-ai-iot
    # image. v0.8.0 is the first llama.cpp release with LFM3 support
    # (ggml-org/llama.cpp#31252) and includes the SWA checkpoint fix
    # (ggml-org/llama.cpp#30666). This tag tracks upstream llama.cpp releases
    # (ci/latest.sh). nv1 runs JetPack 7 (CUDA 13); see
    # .claude/memory/reference_jetson_llama_cuda_tag.md before changing the base.
    repository: ghcr.io/mmalyska/llama-cpp-jetson
    tag: "v0.8.0@sha256:405d802b8e6395b674b45fc4d1ea386b3d0c228eda424ae33442222eadd800bf"
  fetchImage: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  model:
    # LFM3-1.7B replaced Gemma 4 26B-A4B on 2026-10-28 (owner decision, plan in
    # .plans/lfm3-llama-server). Q8_0 is 1.85 GB, so the node has ~10 GB more
    # room than it had with Gemma. The old Gemma file stays on the PVC until it
    # is cleaned up by hand.
    file: LFM3-1.7B-Q8_0.gguf
    url: https://huggingface.co/LiquidAI/LFM3-1.7B-GGUF/resolve/main/LFM3-1.7B-Q8_0.gguf
    sha256: 8f6b24182258205e9e01e21f1f24a1f208c1e8115578825d202ce39976af20b6
    size: "1846238496"
    alias: lfm3-1.7b
  # One slot of 65536 tokens (Hermes refuses a model with less than 64,000
  # tokens of context per slot). Kept at one slot for the first LFM3 run: LFM2.5's
  # hybrid recurrent state corrupted multi-turn output when sequences were
  # co-batched (llama.cpp#29002, still open) and LFM3 is also a conv/attention
  # hybrid. Raise `parallel` (and `ctx` to parallel x 65536) only after the
  # corruption harness shows 0 corrupt turns at that slot count.
  # Consequence: requests from concurrent sessions are served one at a time.
  ctx: 65536
  parallel: 1
  # LFM3 thinks by default (verified 2026-10-28 on v0.8.0): reasoning eats
  # max_tokens and small-budget calls return empty `content` with
  # finish_reason=length. Its chat template reads `enable_thinking`, so default
  # it off; a request can turn it back on with chat_template_kwargs.enable_thinking=true.
  chatTemplateKwargs: '{"enable_thinking":false}'
  # The chart always renders --reasoning-budget; -1 is "unrestricted". (0 breaks
  # the reasoning-content parser on this build, as found with LFM2.5.)
  reasoningBudget: -1
  # Hard cap on tokens generated per request that does not set max_tokens
  # (Lingarr sends none). On one slot a single runaway generation
  # blocks every session until it reaches the context limit; at 16384 it costs
  # ~19 minutes at Gemma's speed. It was 2048 until Lingarr: it sends a
  # whole subtitle file as one batch, ~25 output tokens per cue, so 357 cues need
  # ~9K tokens and a 2048 cap truncated the JSON on every retry. Keep the cap
  # below Bazarr's 32 minute Lingarr timeout (~28K tokens).
  nPredict: 16384
  # Prompt cache and checkpoints are unchanged from the Gemma setup so the first
  # LFM3 run changes one thing (the model). The node has far more headroom now
  # (1.85 GB model vs ~10.5 GB), so both can be raised after measuring: GPU
  # allocations are not charged to the pod cgroup, so watch NODE MemAvailable
  # (`talosctl -n 192.168.48.5 read /proc/meminfo`), not `kubectl top`.
  cacheRam: 640 # MiB of host-RAM prompt cache
  ctxCheckpoints: 2 # per slot
  ubatch: 256 # physical batch; halves the compute buffer vs the 512 default
  storage: 30Gi
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    # Not yet measured with LFM3 (model 1.85 GB plus KV cache and the 640 MiB
    # prompt cache). Re-check the pod working set after the first run. Keep the
    # limit well under the ~13.4 GiB point where the node itself starves, so a
    # runaway kills this pod and not cilium-envoy / node-exporter.
    limits:
      memory: 8Gi
      nvidia.com/gpu: 1
