server:
  replicaCount: 1
  image:
    # Our own build (mmalyska/containers), not NVIDIA's stale nvidia-ai-iot
    # image. v0.8.0 is the first llama.cpp release with LFM3 support
    # (ggml-org/llama.cpp#31252) and includes the SWA checkpoint fix
    # (ggml-org/llama.cpp#30666). This tag tracks upstream llama.cpp releases
    # (ci/latest.sh). nv1 runs JetPack 7 (CUDA 13); see
    # .claude/memory/reference_jetson_llama_cuda_tag.md before changing the base.
    repository: ghcr.io/mmalyska/llama-cpp-jetson
    tag: "v0.8.0@sha256:405d802b8e6395b674b45fc4d1ea386b3d0c228eda424ae33442222eadd800bf"
  fetchImage: alpine:3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  model:
    # LFM3-1.7B replaced Gemma 4 26B-A4B on 2026-10-28 (owner decision, plan in
    # .archive/.plans/lfm3-llama-server). Q8_0 is 1.85 GB, so the node has ~10 GB more
    # room than it had with Gemma. The old Gemma file stays on the PVC until it
    # is cleaned up by hand.
    # TEST 2026-10-29: LFM3-VL-2B replaces LFM3-1.7B to see whether one server can
    # cover text and vision. Revert this block (and mmproj below) to go back to
    # file LFM3-1.7B-Q8_0.gguf, sha256 8f6b24182258205e9e01e21f1f24a1f208c1e8115578825d202ce39976af20b6,
    # alias lfm3-1.7b. The LiteLLM models still point at alias lfm3-1.7b, so the
    # alias is kept to avoid touching the gateway.
    file: LFM3-VL-2B-Q8_0.gguf
    url: https://huggingface.co/LiquidAI/LFM3-VL-2B-GGUF/resolve/main/LFM3-VL-2B-Q8_0.gguf
    sha256: e138e54189a751d90ea8c0b236360490613ecd465d28d68fa6094d3db7fa6727
    size: "1846238496"
    alias: lfm3-1.7b
  # Vision projector for the multimodal model, fetched and verified like the
  # model file and passed as --mmproj. Remove for a text-only model.
  mmproj:
    file: mmproj-LFM3-VL-2B-Q8_0.gguf
    url: https://huggingface.co/LiquidAI/LFM3-VL-2B-GGUF/resolve/main/mmproj-LFM3-VL-2B-Q8_0.gguf
    sha256: c5c5b58d544a18da919172d2d0368090ea1a4a351b6feb7f8a326a264a5918ab
    size: "203031872"
  # One slot (Hermes refuses a model with less than 64,000 tokens of context
  # per slot). Kept at one slot for the first LFM3 run: LFM2.5's
  # hybrid recurrent state corrupted multi-turn output when sequences were
  # co-batched (llama.cpp#29002, still open) and LFM3 is also a conv/attention
  # hybrid. Raise `parallel` (and `ctx` to parallel x 65536) only after the
  # corruption harness shows 0 corrupt turns at that slot count.
  # Consequence: requests from concurrent sessions are served one at a time.
  # Context raised to 131072 (2x the Hermes floor) on 2026-10-28: only 6 of
  # LFM3's 24 layers keep a global KV cache (~4.9 KB/token with q8_0/q4_0), so
  # 128K costs ~0.65 GB. 262144 is the model's trained maximum (~1.3 GB) if a
  # consumer ever needs it. Still one slot, so this is one 131072-token window.
  # TEST 2026-10-29: two slots. `ctx` is the total, split across slots, so 262144 /
  # 2 keeps 131072 per slot. Revert to ctx 131072 / parallel 1 if the corruption
  # harness shows any corrupt turn (llama.cpp#29002) or node MemAvailable drops
  # under ~3 GB.
  ctx: 262144
  parallel: 2
  # Thinking is off by default (owner decision 2026-10-29, reversing 2026-10-28):
  # LFM3's chat template reads `enable_thinking` and defaults it to true, so it is
  # pinned here. Reasoning tokens count toward max_tokens, so with it on a request
  # with a small budget (titles, summaries) returned empty `content`
  # (finish_reason=length). A client that wants reasoning opts in per request with
  # chat_template_kwargs.enable_thinking=true (LiteLLM forwards it to the backend)
  # and gives the call a large max_tokens (4096+).
  chatTemplateKwargs: '{"enable_thinking":false}'
  # The chart always renders --reasoning-budget; -1 is "unrestricted". (0 breaks
  # the reasoning-content parser on this build, as found with LFM2.5.)
  reasoningBudget: -1
  # Hard cap on tokens generated per request that does not set max_tokens
  # (Lingarr sends none). On one slot a single runaway generation
  # blocks every session until it reaches the context limit; at 16384 it costs
  # ~19 minutes at Gemma's speed. It was 2048 until Lingarr: it sends a
  # whole subtitle file as one batch, ~25 output tokens per cue, so 357 cues need
  # ~9K tokens and a 2048 cap truncated the JSON on every retry. Keep the cap
  # below Bazarr's 32 minute Lingarr timeout (~28K tokens).
  nPredict: 16384
  # Raised from the Gemma-era 640 / 2 now that the model is 1.85 GB (node had
  # ~9.4 GB MemAvailable with it loaded). LFM3 checkpoints are small (256-token
  # SWA window plus conv state), so many fit. GPU allocations are not charged to
  # the pod cgroup, so watch NODE MemAvailable
  # (`talosctl -n 192.168.48.5 read /proc/meminfo`), not `kubectl top`.
  cacheRam: 2048 # MiB of host-RAM prompt cache (counts against the pod limit)
  ctxCheckpoints: 16 # per slot
  # Defaults from the LFM3 model card for chat, tool use and agents. A client
  # that sends its own value wins. Lingarr (translation) may dislike repeat
  # penalty 1.1; test 1.0 for it. Remove a key to fall back to llama.cpp's default.
  sampling:
    temp: 0.1
    topK: 50
    repeatPenalty: 1.1
  # KV cache types. q8_0 K / q4_0 V was chosen for Gemma when memory was the
  # constraint. LFM3 has only 6 global-attention layers, so even f16 is ~12 KiB/token
  # (1.5 GB at 128K); q4_0 V is the likeliest cause of quality loss, so test q8_0/q8_0
  # and f16/f16 against the corruption harness before keeping either.
  kvCache:
    k: q8_0
    v: q8_0
  ubatch: 256 # physical batch; halves the compute buffer vs the 512 default
  storage: 30Gi
  resources:
    requests:
      cpu: 500m
      memory: 4Gi # measured 2026-10-29: 4.0 GB working set (cgroup memory.current) after ~30 min of tests
    # The prompt cache (2048 MiB) had not filled yet (anon 1.26 GB), so the pod
    # can still grow by up to ~2 GiB. Keep the limit well under the ~13.4 GiB
    # point where the node itself starves, so a runaway kills this pod and not
    # cilium-envoy / node-exporter.
    limits:
      memory: 8Gi
      nvidia.com/gpu: 1
