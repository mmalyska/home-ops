stt:
  image:
    repository: ghcr.io/speaches-ai/speaches
    tag: "0.9.0-rc.3-cpu@sha256:2163775b6df5e451a71200e8f675fed68dbd8ab184fc604453d549e486f22fd2"
  storage: 10Gi
  # CPU inference. compute_type "default" runs the fp16 large model as float32
  # (~3.6 GiB, RTF ~4 on 3 cores, OOM at the 4Gi limit); int8 is the CPU-suited
  # quantization. Threads match the CPU limit so CFS throttling does not add
  # stalls.
  env:
    WHISPER__COMPUTE_TYPE: int8
    WHISPER__CPU_THREADS: "3"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "3"
      memory: 4Gi
