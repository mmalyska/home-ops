prometheus-smartctl-exporter:
  image:
    repository: ghcr.io/home-operations/smartctl-exporter
    tag: "0.14.0@sha256:1ce54f6215b4e92ce600d292e6f88af100146521a8e54f449adf3c0f333a9571"

  # the chart overwrites each instance's config with common.config, so the scan interval has to be set here
  common:
    config:
      # SMART data changes slowly; the exporter scans in the background and serves cached values between scans
      collect_not_more_than_period: 15m

  config:
    devices:
      - /dev/sda
      - /dev/nvme0n1

  serviceMonitor:
    enabled: true
    interval: 2m
    scrapeTimeout: 30s
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node
        action: replace

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [mc1, mc2, mc3]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      # no CPU limit: smartctl runs in short multi-threaded bursts, any limit (even 1 CPU) throttled a few periods
      # (CPUThrottlingHigh) while average usage is ~10m. The chart ships without limits too
      memory: 64Mi

  extraInstances:
    - config:
        devices:
          - /dev/nvme0n1
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [nv1]
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          # no CPU limit, same burst pattern as the main instance, see above
          memory: 64Mi
