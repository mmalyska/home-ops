---
# Warns (never denies) when a Pod is created with a container that has no cpu or
# memory request, or no memory limit. Warn shows up in kubectl output; Audit puts
# the violation in the API server audit annotations. The Prometheus alert
# ContainerMissingMemoryLimit is the backstop that actually reaches Discord.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: containers-have-resources
spec:
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: >-
        every container needs cpu and memory requests and a memory limit
        (see docs/src/k8s/resource-sizing.md)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: containers-have-resources
spec:
  policyName: containers-have-resources
  validationActions: [Warn, Audit]
  matchResources:
    namespaceSelector:
      matchExpressions:
        # Talos-managed static pods and cilium live here and have no limits by design.
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
