# pods/exec for the workspace ServiceAccounts in the namespaces of `execNamespaces` only (values.yaml). `get` on
# pods comes from the read-only ClusterRole; exec itself needs create (and get, for the websocket transport).
{{- range $ns := .Values.execNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Namespace }}-exec
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
{{- range $.Values.workspaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Namespace }}-{{ .name }}-exec
  namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Namespace }}-exec
subjects:
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
