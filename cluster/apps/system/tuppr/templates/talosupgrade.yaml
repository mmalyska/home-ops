apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  talos:
    # renovate: datasource=github-releases depName=siderolabs/talos
    version: v1.14.2
  policy:
    waitForVolumeDetach: true
    timeout: 30m
  maintenance:
    windows:
      - start: "0 7 * * 0"
        duration: 4h
        timezone: Europe/Warsaw
  silences:
    - matchers:
        - name: alertname
          value: ^(CephMonDown|CephOSDDown|KubeNodeUnreachable|TargetDown)$
          matchType: "=~"
      maxDuration: 2h
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 10m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
      expr: status.ceph.health in ["HEALTH_OK"]
      timeout: 30m
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True") && status.readyInstances == object.spec.instances
      timeout: 30m
    - apiVersion: postgresql.cnpg.io/v1
      kind: Backup
      expr: '!has(status.phase) || !(status.phase in ["started", "running", "finalizing"])'
      timeout: 1h
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: '!has(status.conditions) || !status.conditions.exists(c, c.type == "Synchronizing" && c.status == "True")'
      timeout: 1h
    - apiVersion: batch/v1
      kind: Job
      expr: "!has(status.active) || status.active == 0"
      timeout: 1h
