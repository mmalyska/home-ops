tuppr:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi
    limits:
      memory: 256Mi
  monitoring:
    serviceMonitor:
      enabled: true
    # The chart rule TupprUpgradeBlocked (reason Waiting.* or Suspended, for 30m, warning, routed to Discord)
    # fires for a suspended CR. Both CRs are unsuspended now, so the rules are on; suspending a CR again (to stop a
    # run or hold an upgrade) pages after 30 minutes, which is intended.
    prometheusRule:
      enabled: true
    dashboards:
      enabled: true
  silences:
    enabled: true
    alertmanager:
      address: http://prometheus-stack-kube-prom-alertmanager.monitoring:9093
