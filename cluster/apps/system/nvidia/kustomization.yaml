---
# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nvidia-system
resources:
  - resources/cdi-setup.yaml
  - resources/device-plugin.yaml
  - resources/power-mode.yaml
  - resources/gpu-exporter.yaml
  - resources/gpu-exporter-rules.yaml
configMapGenerator:
  - name: nvidia-device-plugin-watchdog
    files:
      - watchdog.sh=resources/watchdog.sh
  - name: jetson-gpu-exporter
    files:
      - metrics=resources/gpu-exporter.sh
