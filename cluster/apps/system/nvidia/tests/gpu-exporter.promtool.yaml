# promtool rule tests for resources/gpu-exporter-rules.yaml, run by `task lint:manifests` and CI
# (.taskfiles/lint/resources/check-manifests.sh). The script renders the app and writes its PrometheusRule
# groups to rules.yaml next to a copy of this file.
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  # nv1 as checked on 2026-11-25: min, max and current clock all 918 MHz.
  - name: clock at the cap does not fire
    interval: 1m
    input_series:
      - series: 'jetson_gpu_frequency_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "918000000x20"
      - series: 'jetson_gpu_frequency_max_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "918000000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: JetsonGpuClockAboveCap
        exp_alerts: []

  # r39 default after the devfreq node appears, before the cap is applied: max 1173 MHz. Both series high gives
  # one alert, not two. Not yet at 1m (for: 2m), fires at 5m.
  - name: devfreq maximum and clock above the cap
    interval: 1m
    input_series:
      - series: 'jetson_gpu_frequency_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "1173000000x20"
      - series: 'jetson_gpu_frequency_max_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "1173000000x20"
    alert_rule_test:
      - eval_time: 1m
        alertname: JetsonGpuClockAboveCap
        exp_alerts: []
      - eval_time: 5m
        alertname: JetsonGpuClockAboveCap
        exp_alerts:
          - exp_labels:
              severity: critical
              node: nv1
            exp_annotations:
              summary: The Jetson GPU on nv1 can run above the 918 MHz cap
              description: >-
                The GPU clock or its devfreq maximum is 1.173GHz. This board cannot cool the 1173 MHz Super clock.
                Check the jetson-power-mode logs in nvidia-system (it re-applies the cap every second while the
                devfreq node is new and every 60 s after); if the cap does not hold, stop the GPU workload (scale
                llama-server to 0) until it does.

  # A governor that ignores max_freq: maximum at the cap, current clock above it.
  - name: current clock above the cap alone fires
    interval: 1m
    input_series:
      - series: 'jetson_gpu_frequency_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "1020000000x20"
      - series: 'jetson_gpu_frequency_max_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "918000000x20"
    alert_rule_test:
      - eval_time: 5m
        alertname: JetsonGpuClockAboveCap
        exp_alerts:
          - exp_labels:
              severity: critical
              node: nv1
            exp_annotations:
              summary: The Jetson GPU on nv1 can run above the 918 MHz cap
              description: >-
                The GPU clock or its devfreq maximum is 1.02GHz. This board cannot cool the 1173 MHz Super clock.
                Check the jetson-power-mode logs in nvidia-system (it re-applies the cap every second while the
                devfreq node is new and every 60 s after); if the cap does not hold, stop the GPU workload (scale
                llama-server to 0) until it does.

  # A short spike that the power-mode loop corrects within a minute does not page.
  - name: one-minute spike does not fire
    interval: 1m
    input_series:
      - series: 'jetson_gpu_frequency_max_hz{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "918000000x5 1173000000 918000000x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: JetsonGpuClockAboveCap
        exp_alerts: []

  # Healthy: pod on a Ready node, scraped.
  - name: exporter up does not fire
    interval: 1m
    input_series:
      - series: 'kube_pod_info{namespace="nvidia-system",created_by_kind="DaemonSet",created_by_name="jetson-gpu-exporter",node="nv1",pod="jetson-gpu-exporter-abcde"}'
        values: "1x30"
      - series: 'up{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "1x30"
      - series: 'kube_node_status_condition{node="nv1",condition="Ready",status="true"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 25m
        alertname: JetsonGpuExporterDown
        exp_alerts: []

  # Scrape fails (up 0) on a Ready node: fires after 15 minutes.
  - name: scrape failing fires
    interval: 1m
    input_series:
      - series: 'kube_pod_info{namespace="nvidia-system",created_by_kind="DaemonSet",created_by_name="jetson-gpu-exporter",node="nv1",pod="jetson-gpu-exporter-abcde"}'
        values: "1x30"
      - series: 'up{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "0x30"
      - series: 'kube_node_status_condition{node="nv1",condition="Ready",status="true"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: JetsonGpuExporterDown
        exp_alerts: []
      - eval_time: 20m
        alertname: JetsonGpuExporterDown
        exp_alerts:
          - exp_labels: &down-labels
              severity: warning
              node: nv1
            exp_annotations: &down-annotations
              summary: No Jetson GPU metrics from nv1
              description: >-
                The jetson-gpu-exporter pod on nv1 has not been scraped successfully for 15 minutes, so
                JetsonGpuClockAboveCap cannot fire. Check the pod and its logs in nvidia-system, and
                jetson_exporter_source_up once it answers.

  # Pod exists but never becomes a target (crash loop before the first scrape): no up series at all.
  - name: no target at all fires
    interval: 1m
    input_series:
      - series: 'kube_pod_info{namespace="nvidia-system",created_by_kind="DaemonSet",created_by_name="jetson-gpu-exporter",node="nv1",pod="jetson-gpu-exporter-abcde"}'
        values: "1x30"
      - series: 'kube_node_status_condition{node="nv1",condition="Ready",status="true"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: JetsonGpuExporterDown
        exp_alerts:
          - exp_labels: *down-labels
            exp_annotations: *down-annotations

  # nv1 not Ready: the node alerts cover it.
  - name: node not ready does not fire
    interval: 1m
    input_series:
      - series: 'kube_pod_info{namespace="nvidia-system",created_by_kind="DaemonSet",created_by_name="jetson-gpu-exporter",node="nv1",pod="jetson-gpu-exporter-abcde"}'
        values: "1x30"
      - series: 'up{job="nvidia-system/jetson-gpu-exporter",node="nv1"}'
        values: "0x30"
      - series: 'kube_node_status_condition{node="nv1",condition="Ready",status="true"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: JetsonGpuExporterDown
        exp_alerts: []
