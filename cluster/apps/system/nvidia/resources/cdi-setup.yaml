---
# nvidia-cdi-setup (JetPack r39 / JetPack 7.2) — GPU system setup + CDI spec writer
#
# JetPack 7 version of the previous JetPack 6 setup (taken from mmalyska/talos-jetson-orin manifests/gpu/cdi-setup-r39.yaml,
# docs/jetpack7.md there). Differences from the JetPack 6 one:
#
#   1. No library download. libcuda and the NVIDIA runtime libraries it needs (libnvrm_gpu,
#      libnvrm_mem, libnvsciipc, ...) come inside the node image as the nvidia-tegra-userspace
#      system extension (scripts/build-r39-userspace.sh) and appear on the host under
#      /usr/local/lib/nvidia-tegra. The r39 packages are not in NVIDIA's apt repository, and
#      the BSP tarball they live in is 1.3 GB, so a per-node download is not an option.
#
#   2. More device nodes. The r39 libraries also open /dev/host1x-fence (host1x-fence.ko) and
#      the /dev/nvhost-* and /dev/host1x-* nodes that exist; every char device found is injected.
#      The r36 /dev/nvhost-ctrl compatibility symlink is gone.
#
#   3. Firmware handling is unchanged: the nvidia-firmware-ext extension puts the GA10B files
#      in /usr/lib/firmware/ga10b; they are copied to NVMe /var/fw-fresh and firmware_class.path
#      is redirected there to avoid -ETXTBSY on squashfs inodes.
#
#   4. Writes /var/run/cdi/nvidia-jetson.yaml (spec generated dynamically from the device nodes
#      that actually exist) and keeps it alive across tmpfs resets.
#
# Only for nv1 running the JetPack 7 node image (custom-installer ...-nvgpu39.2.1-jp7). On the JetPack 6 image it has no
# libraries to mount (/usr/local/lib/nvidia-tegra does not exist).
---
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
---
# Shell scripts are stored in a ConfigMap to keep the DaemonSet YAML readable
# and avoid any YAML escaping issues with complex heredocs / multi-line strings.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-cdi-setup-scripts
  namespace: nvidia-system
data:
  # ── cdi-writer.sh ─────────────────────────────────────────────────────────
  # Runs in the long-lived container: sets up firmware, device
  # permissions, and writes the CDI spec.  Loops every 60 s to regenerate the
  # spec if /var/run is cleared (tmpfs reset after host reboot).
  cdi-writer.sh: |
    #!/bin/sh
    set -e

    CDI_DIR=/var/run/cdi
    CDI_SPEC="${CDI_DIR}/nvidia-jetson.yaml"
    FW_SRC=/host-firmware/ga10b
    FW_DEST=/host-var/fw-fresh/ga10b

    write_cdi_spec() {
      mkdir -p "${CDI_DIR}"

      # Open the spec file and write each section with echo/printf.
      # We avoid heredocs because the YAML-in-YAML nesting makes indentation
      # tricky; individual echo statements are unambiguous.

      {
        echo 'cdiVersion: "0.5.0"'
        echo 'kind: "nvidia.com/gpu"'
        echo 'devices:'
        echo '  - name: "0"'
        echo '    containerEdits:'
        echo '      deviceNodes:'
        # Device strategy: inject all nvgpu/* devices + /dev/dri/renderD128.
        #
        # /dev/dri/renderD128 is the DRM render node created by tegra-drm.ko (OE4T build).
        # libcuda.so opens this node during cuInit to enumerate the iGPU.
        # Without it, cuInit returns 801 (CUDA_ERROR_NOT_SUPPORTED).
        #
        # r39: the libraries also open /dev/host1x-fence and whichever /dev/nvhost-* and
        # /dev/host1x-* nodes exist; those are injected below when they are real char devices.

        # All /dev/nvgpu/igpu0/* char devices
        for dev in $(find /dev/nvgpu/igpu0/ -type c 2>/dev/null | sort); do
          printf '        - path: %s\n          permissions: rw\n' "${dev}"
        done

        # /dev/nvmap — required for GPU memory allocation
        if [ -c /dev/nvmap ]; then
          printf '        - path: /dev/nvmap\n          permissions: rw\n'
        fi

        # /dev/host1x-fence (host1x-fence.ko) and any /dev/nvhost-* / /dev/host1x-* node that
        # exists. Only real char devices: CDI rejects symlinks ("not a device node").
        for dev in $(find /dev -maxdepth 1 \( -name 'host1x-*' -o -name 'nvhost-*' \) -type c 2>/dev/null | sort); do
          printf '        - path: %s\n          permissions: rw\n' "${dev}"
        done

        # /dev/dri/renderD128: DRM render node created by tegra-drm.ko (OE4T build).
        # Required by libcuda.so for GPU enumeration on Tegra (cuInit).
        # Inject only when the node actually exists (requires tegra-drm extension).
        if [ -c /dev/dri/renderD128 ]; then
          printf '        - path: /dev/dri/renderD128\n          permissions: rw\n'
        fi
        echo '      mounts:'
        echo '        # Bind-mount the JetPack r39 library directory shipped by the nvidia-tegra-userspace'
        echo '        # system extension (libcuda and the libraries it needs).'
        echo '        - hostPath: /usr/local/lib/nvidia-tegra'
        echo '          containerPath: /usr/lib/aarch64-linux-gnu/nvidia'
        echo '          options: [ro, bind]'
        echo '      env:'
        echo '        # Prepend the r39 libs so they shadow any stubs in the image.'
        echo '        - "LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/nvidia:/usr/local/cuda/lib:/usr/local/cuda/lib64:/usr/local/cuda/compat"'
        # containerEdits at spec root must be an object (ContainerEdits), not an
        # array.  Omit it entirely — it is optional and defaults to empty.
        # (Writing 'containerEdits: []' causes containerd to reject the spec with
        #  "cannot unmarshal array into Go struct field Spec.containerEdits")
      } > "${CDI_SPEC}"

      DEV_COUNT=$(grep -c 'path: /dev/' "${CDI_SPEC}" 2>/dev/null || echo 0)
      echo "[cdi-setup] CDI spec written: ${CDI_SPEC} (${DEV_COUNT} device nodes)"
    }

    # ── Firmware copy (idempotent) ─────────────────────────────────────────
    if [ ! -f "${FW_DEST}/gpmu_ucode_next_prod_image.bin" ]; then
      echo "[cdi-setup] Copying GPU firmware to NVMe /var/fw-fresh..."
      mkdir -p "${FW_DEST}"
      cp "${FW_SRC}/"* "${FW_DEST}/" 2>/dev/null || true
    fi
    echo "[cdi-setup] Redirecting firmware_class.path -> /var/fw-fresh"
    echo -n '/var/fw-fresh' > /sys/module/firmware_class/parameters/path

    # ── Device permissions ────────────────────────────────────────────────
    for dev in \
        $(find /dev/nvgpu/ -type c 2>/dev/null) \
        $(find /dev/ -maxdepth 1 \( -name 'nvhost-*' -o -name 'host1x-*' \) -type c 2>/dev/null) \
        /dev/nvmap; do
      if [ -e "${dev}" ]; then chmod 666 "${dev}" 2>/dev/null || true; fi
    done

    # ── Initial CDI spec write ─────────────────────────────────────────────
    write_cdi_spec
    echo "[cdi-setup] Setup complete — entering watch loop (60 s interval)"

    # ── Watch loop: regenerate spec if /var/run is cleared ─────────────────
    while true; do
      sleep 60
      if [ ! -f "${CDI_SPEC}" ]; then
        echo "[cdi-setup] CDI spec missing — regenerating..."
        write_cdi_spec
      fi
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-cdi-setup
  namespace: nvidia-system
  labels:
    app: nvidia-cdi-setup
spec:
  selector:
    matchLabels:
      app: nvidia-cdi-setup
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-cdi-setup
    spec:
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      hostPID: true

      # Firmware + device setup + CDI spec (the libraries come with the node image)
      containers:
        - name: cdi-writer
          image: busybox:1.36
          command: ["/bin/sh", "/scripts/cdi-writer.sh"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: sys
              mountPath: /sys
            - name: host-firmware
              mountPath: /host-firmware
              readOnly: true
            - name: host-var
              mountPath: /host-var
            - name: cdi-dir
              mountPath: /var/run/cdi
            - name: scripts
              mountPath: /scripts

      volumes:
        - name: dev
          hostPath:
            path: /dev
        - name: sys
          hostPath:
            path: /sys
        - name: host-firmware
          hostPath:
            path: /usr/lib/firmware
        - name: host-var
          hostPath:
            path: /var
        - name: cdi-dir
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: nvidia-cdi-setup-scripts
            defaultMode: 0755
