apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: multus

resources:
  # Upstream ships the manifest in the repo (deployments/), not as a release asset
  # renovate-raw: datasource=github-tags depName=k8snetworkplumbingwg/multus-cni
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/v4.3.1/deployments/multus-daemonset-thick.yml
  # Talos ships only bridge/firewall/flannel/host-local/loopback/portmap in /opt/cni/bin;
  # this installs macvlan + static (needed by the macvlan NetworkAttachmentDefinitions).
  - cni-plugins.yaml

images:
  # upstream references the floating snapshot-thick tag; pin the release
  - name: ghcr.io/k8snetworkplumbingwg/multus-cni
    newTag: v4.3.1-thick
    digest: sha256:a357a79359b80ddd5f4699117946cacf3b54f5baecf7944535594863e875fc25

patches:
  # Talos guide (siderolabs "Multus"): the upstream 50Mi limit can OOM-kill the
  # primary CNI plugin. (The /var/run/netns hostPath patch is not needed: /var/run -> /run
  # on these nodes, verified with talosctl.)
  - target:
      kind: DaemonSet
      name: kube-multus-ds
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 200m
            memory: 100Mi
          limits:
            cpu: 300m
            memory: 150Mi
