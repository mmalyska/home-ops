apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: unpoller-secret
    creationPolicy: Owner
    template:
      data:
        UNIFI_USER: '{{ `{{ .UNIFI_USER }}` }}'
        UNIFI_PASS: '{{ `{{ .UNIFI_PASS }}` }}'
  data:
    # TODO: create a UniFi *local* read-only admin (UniFi OS → Admins →
    # Add Admin → Local Access Only, Role: Viewer, all sites), store its
    # username and password in Bitwarden Secrets Manager, then replace both
    # UUIDs below. The app will not start until these resolve.
    - secretKey: UNIFI_USER
      remoteRef:
        key: "SET-BITWARDEN-UUID-UNIFI-USER" #gitleaks:allow #UNIFI_USER
    - secretKey: UNIFI_PASS
      remoteRef:
        key: "SET-BITWARDEN-UUID-UNIFI-PASS" #gitleaks:allow #UNIFI_PASS
