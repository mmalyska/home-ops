apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: unpoller-secret
    creationPolicy: Owner
    template:
      data:
        UNIFI_API_KEY: '{{ `{{ .UNIFI_API_KEY }}` }}'
  data:
    # TODO: create a UniFi API key (UniFi OS -> Control Plane -> Integrations
    # -> API Keys; exact path varies by version), store it in Bitwarden
    # Secrets Manager, then replace the UUID below.
    #
    # An API key is the whole credential: unpoller clears User/Pass when
    # APIKey is set, so no local admin account is needed. The app will not
    # start until this resolves.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: "SET-BITWARDEN-UUID-UNIFI-API-KEY" #gitleaks:allow #UNIFI_API_KEY
