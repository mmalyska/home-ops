apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: unpoller-secret
    creationPolicy: Owner
    template:
      data:
        UNIFI_API_KEY: '{{ `{{ .UNIFI_API_KEY }}` }}'
  data:
    # UniFi API key. This is the whole credential — unpoller clears User/Pass
    # when APIKey is set, so no local admin account is involved.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: "cbf372e7-c960-4a6f-b1c7-b4c000c8df58" #gitleaks:allow
