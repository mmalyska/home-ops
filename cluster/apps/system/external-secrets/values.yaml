external-secrets:
  installCRDs: true
  replicaCount: 1
  revisionHistoryLimit: 3
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  serviceMonitor:
    enabled: true
  webhook:
    revisionHistoryLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 192Mi
    serviceMonitor:
      enabled: true
  certController:
    revisionHistoryLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
  bitwarden-sdk-server:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 448Mi
      limits:
        memory: 768Mi
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: "bitwarden-tls-certs"
