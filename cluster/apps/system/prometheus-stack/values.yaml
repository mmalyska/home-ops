kube-prometheus-stack:
  defaultRules:
    rules:
      kubeProxy: false
  kubeControllerManager:
    enabled: true
  kubeEtcd:
    enabled: true
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: true
  kubeApiServer:
    serviceMonitor:
      # job="apiserver" alone accounted for 129,633 of 275,451 active series
      # (47%), almost entirely histogram buckets. Each series is sampled
      # forever and written to Ceph, so cardinality here translates directly
      # into wear on the MX500 OSD drives.
      #
      # Dropped below are buckets no bundled rule or dashboard consumes,
      # ~42k series between them. Deliberately NOT dropped, despite being the
      # largest of all: apiserver_request_duration_seconds_bucket,
      # apiserver_request_sli_duration_seconds_bucket and
      # etcd_request_duration_seconds_bucket — the kube-apiserver SLO and
      # etcd alert rules are built on them, and dropping them would silently
      # break alerting rather than just saving space.
      metricRelabelings:
        # First rule is the chart's own default, restated verbatim. Setting
        # metricRelabelings replaces the default list rather than appending to
        # it, so omitting this would silently re-admit the noisy le buckets on
        # the four largest histograms — increasing cardinality, not reducing
        # it. Keep it first, and re-check it on chart upgrades.
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels:
            - __name__
            - le
        - sourceLabels: [__name__]
          action: drop
          regex: apiserver_request_body_size_bytes_bucket
        - sourceLabels: [__name__]
          action: drop
          regex: apiserver_watch_cache_read_wait_seconds_bucket
        - sourceLabels: [__name__]
          action: drop
          regex: apiserver_watch_list_duration_seconds_bucket
        - sourceLabels: [__name__]
          action: drop
          regex: apiserver_response_sizes_bucket
        - sourceLabels: [__name__]
          action: drop
          regex: apiserver_watch_events_sizes_bucket
  grafana:
    revisionHistoryLimit: 3
    grafana.ini:
      security:
        allow_embedding: true
      auth.anonymous:
        enabled: false
    route:
      main:
        enabled: true
        annotations:
          external-dns.alpha.kubernetes.io/controller: dns-controller
        parentRefs:
          - name: envoy-internal
            namespace: envoy-gateway
            sectionName: https
        hostnames:
          - grafana.<secret:private-domain>
    deploymentStrategy:
      type: Recreate
    persistence:
      enabled: true
      size: 10Gi
      accessModes: ["ReadWriteOnce"]
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: "default"
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/default
          - name: "device"
            orgId: 1
            folder: "Devices Metrics"
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/device
          - name: "grafana-dashboards-kubernetes"
            orgId: 1
            folder: "Kubernetes"
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
          - name: "ceph"
            orgId: 1
            folder: "Ceph"
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/ceph
          # Every key under `dashboards:` MUST have a provider with a matching
          # name here. The provider is what creates
          # /var/lib/grafana/dashboards/<name>, and the chart's
          # download_dashboards.sh init container writes into that directory.
          # Adding a `dashboards.unifi:` block without this entry made the
          # init container fail with "can't create .../unifi/...json:
          # nonexistent directory", crash-looping Grafana on startup.
          - name: "unifi"
            orgId: 1
            folder: "UniFi"
            type: file
            disableDeletion: true
            editable: false
            options:
              path: /var/lib/grafana/dashboards/unifi
    dashboardsConfigMaps:
      device: "device-dashboards"
    dashboards:
      grafana-dashboards-kubernetes:
        k8s-system-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          token: ""
        k8s-system-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          token: ""
        k8s-views-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          token: ""
        k8s-views-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          token: ""
        k8s-views-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          token: ""
        k8s-views-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          token: ""
        cncf:
          url: https://raw.githubusercontent.com/cloudnative-pg/charts/main/charts/cloudnative-pg/monitoring/grafana-dashboard.json
          token: ""
        argocd:
          url: https://raw.githubusercontent.com/argoproj/argo-cd/master/examples/dashboard.json
          token: ""
      unifi:
        # UniFi-Poller's published dashboards (grafana.com). IDs verified
        # against the grafana.com API — the numbering is not in the order
        # the names suggest.
        unifi-network-sites:
          gnetId: 11311
          revision: 5
          datasource: Prometheus
        unifi-usw-insights:
          gnetId: 11312
          revision: 9
          datasource: Prometheus
        unifi-usg-insights:
          gnetId: 11313
          revision: 9
          datasource: Prometheus
        unifi-uap-insights:
          gnetId: 11314
          revision: 10
          datasource: Prometheus
        unifi-client-insights:
          gnetId: 11315
          revision: 9
          datasource: Prometheus
      ceph:
        ceph-cluster:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/ceph-cluster.json
          token: ""
        ceph-cluster-advanced:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/ceph-cluster-advanced.json
          token: ""
        ceph-hosts-overview:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/hosts-overview.json
          token: ""
        ceph-host-details:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/host-details.json
          token: ""
        ceph-osds-overview:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/osds-overview.json
          token: ""
        ceph-osd-device-details:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/osd-device-details.json
          token: ""
        ceph-pool-overview:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/pool-overview.json
          token: ""
        ceph-pool-detail:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/pool-detail.json
          token: ""
        ceph-cephfs-overview:
          url: https://raw.githubusercontent.com/ceph/ceph/v20.2.0/monitoring/ceph-mixin/dashboards_out/cephfs-overview.json
          token: ""
        rook-ceph-cluster:
          url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20Cluster%20Dashboard.json
          token: ""
        rook-ceph-osd:
          url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20OSD%20Single%20Dashboard.json
          token: ""
        rook-ceph-pools:
          url: https://raw.githubusercontent.com/rook/rook/v1.20.0/deploy/examples/monitoring/grafana/Ceph%20Pools%20Dashboard.json
          token: ""
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
    sidecar:
      datasources:
        # Runs the datasources sidecar as a native Kubernetes sidecar
        # (restartPolicy: Always on an initContainer, K8s 1.29+) so the
        # ConfigMap-sourced datasources file is fully written before Grafana's
        # one-shot (non-watching) datasource provisioning scan runs at boot,
        # while still continuing to watch for future changes afterward.
        # Without this, a race on cold start can silently drop brand-new
        # datasources (observed: Loki missing from /api/datasources after
        # the initial sync, confirmed not self-healing across 3+ minutes).
        # restartPolicy: Always is required here — without it this becomes a
        # classic init container running a perpetual WATCH loop that never
        # exits, which would hang the pod at Init:.../1 forever.
        initDatasources: true
        restartPolicy: Always
        # restartPolicy: Always alone only guarantees the sidecar's container
        # process has started before Grafana's container starts — it does NOT
        # wait for the sidecar's initial ConfigMap sync to finish. Confirmed
        # live: Grafana started 2s before the sidecar had actually finished
        # writing datasource.yaml, so Loki was still missing after this fix
        # alone. The sidecar's /healthz returns 503 until its initial sync
        # completes (kiwigrid/k8s-sidecar's mark_ready()), so a startupProbe
        # against it makes Kubernetes actually wait for real readiness, not
        # just process start.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8082
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 30
  alertmanager:
    # No `config:` block here — deliberately left as the chart's own
    # default (null receiver + Watchdog->null + standard inhibit_rules).
    # Discord routing is handled entirely by the AlertmanagerConfig CRD
    # (templates/alertmanagerconfig-discord.yaml) instead of a raw
    # discord_configs entry in this values.yaml block, because the raw
    # config path requires a webhook_url_file reference that the
    # Prometheus Operator's config parser rejects in this environment
    # ("field webhook_url_file not found in type alertmanager.discordConfig",
    # confirmed live — prometheus-operator/prometheus-operator#7159, open
    # upstream, fix unmerged as prometheus-operator/prometheus-operator#6346).
    # The AlertmanagerConfig CRD's discordConfigs[].apiURL is a native
    # SecretKeySelector, unaffected by that bug.
    alertmanagerSpec:
      # AlertmanagerConfig objects default to only matching alerts in their
      # own namespace (the operator force-injects a namespace matcher on
      # their first-level route). CNPG alerts span every app namespace, so
      # routing needs None here to let alertmanagerconfig-discord.yaml's own
      # severity matcher control matching instead of an implicit namespace
      # scope. There's only one AlertmanagerConfig object in this cluster,
      # so there's no multi-tenant isolation being given up by this.
      alertmanagerConfigMatcherStrategy:
        type: None
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 25Gi
  prometheusOperator:
    revisionHistoryLimit: 3
  kube-state-metrics:
    revisionHistoryLimit: 3
  prometheus:
    prometheusSpec:
      # 60s rather than the 30s default. Every sample written lands on the
      # Ceph RBD volume and, at 3x replication, on all three consumer-grade
      # MX500 OSD drives. Those drives are at 62-70% rated life after ~4
      # years with only ~27 TB of host writes each — they age on NAND P/E
      # cycles, so halving the sample rate directly slows that curve.
      # 60s resolution is ample for this cluster; raise it back if a
      # short-lived spike ever needs to be caught.
      scrapeInterval: 60s
      retention: 10d
      retentionSize: 20GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 25Gi
      resources:
        requests:
          memory: 2500Mi
          cpu: 200m
        limits:
          memory: 4Gi
          cpu: "1"
      ruleSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      additionalScrapeConfigs:
        # The asusrouter job (192.168.50.1:9101) was removed with the house
        # move — the RT-AX58U is retired and a UCG-Max replaced it. UniFi
        # metrics now come from the unpoller app via its ServiceMonitor.
        - job_name: "qnap"
          scrape_interval: 10s
          static_configs:
            - targets: ["192.168.50.8:9094"]
  prometheus-node-exporter:
    # pinned master build 2026-06-23 — includes EINVAL graceful-skip fix (upstream PR #3657)
    # REF: https://github.com/prometheus/node_exporter/issues/3071
    # TODO: switch back to quay.io release once v1.11.2+ ships
    version: "1.11.1"
    image:
      registry: ghcr.io
      repository: prometheus/node-exporter
      tag: master
      distroless: true
      digest: sha256:b98487477720b20143998d569c7a3d66bff7f092de2f935038a9d10646fc2d5f
    extraArgs:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
      - --collector.nvme
      # drm: Intel GPU frequency/engine metrics on mc nodes; nv1 has no DRM card, collector is a no-op there
      - --collector.drm
