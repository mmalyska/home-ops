apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resource-sizing
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
    # Sizing aids, not alerts: p95 over the last 7 days next to what each
    # container requests and is limited to. Prometheus keeps 10d of data
    # (retention in values.yaml), so 7d is the longest window that is complete.
    # Read them in Grafana Explore; ratios far below 1 against the request mean
    # the request is too high, ratios above 1 mean it is too low.
    - name: resource.sizing
      interval: 30m
      rules:
        - record: resource_audit:container_memory_working_set_bytes:p95_7d
          expr: >-
            quantile_over_time(0.95,
              (max by (namespace, pod, container) (node_namespace_pod_container:container_memory_working_set_bytes))[7d:5m])
        - record: resource_audit:container_memory_working_set_bytes:max_7d
          expr: >-
            max_over_time(
              (max by (namespace, pod, container) (node_namespace_pod_container:container_memory_working_set_bytes))[7d:5m])
        - record: resource_audit:container_cpu_usage_cores:p95_7d
          expr: >-
            quantile_over_time(0.95,
              (max by (namespace, pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m))[7d:5m])
        - record: resource_audit:container_memory_p95_vs_request:ratio
          expr: >-
            resource_audit:container_memory_working_set_bytes:p95_7d
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="memory"})
        - record: resource_audit:container_memory_max_vs_limit:ratio
          expr: >-
            resource_audit:container_memory_working_set_bytes:max_7d
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
        - record: resource_audit:container_cpu_p95_vs_request:ratio
          expr: >-
            resource_audit:container_cpu_usage_cores:p95_7d
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_requests{resource="cpu"})
    # CPUThrottlingHigh, KubeMemoryOvercommit and KubeCPUOvercommit already come
    # from the chart's default rules. These cover what they do not.
    - name: resource.alerts
      rules:
        # llama-server is excluded: its working set includes the mmap'd model and
        # sits near the limit by design; nv1 memory is watched by Nv1MemoryLow.
        - alert: ContainerMemoryNearLimit
          expr: >-
            max by (namespace, pod, container) (container_memory_working_set_bytes{container!="",container!="POD",container!="llama-server"})
            / on (namespace, pod, container)
            max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.9
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Container is close to its memory limit
            description: >-
              {{ "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}" }} has used more than 90% of
              its memory limit for 15 minutes and will be OOM-killed if it grows. Raise the limit or find the leak.
        - alert: ContainerOOMKilled
          expr: >-
            (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            and on (namespace, pod, container)
            (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
          labels:
            severity: warning
          annotations:
            summary: Container was OOM-killed
            description: >-
              {{ "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}" }} restarted in the last 15
              minutes and its last termination reason is OOMKilled. Its memory limit is too low.
        # The exclusions are workloads that cannot be given a limit from git:
        # kube-system is Talos-managed (static pods, cilium), and the rook
        # containers are generated by the operator.
        - alert: ContainerMissingMemoryLimit
          expr: >-
            (
              kube_pod_container_info{namespace!="kube-system",container!~"log-rotator|rook-discover|shutdown-manager"}
              unless on (namespace, pod, container)
              kube_pod_container_resource_limits{resource="memory"}
            )
            and on (namespace, pod)
            (kube_pod_status_phase{phase="Running"} == 1)
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: Container has no memory limit
            description: >-
              {{ "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }}" }} has run for a day without a
              memory limit. Add requests and a memory limit in its values; see docs/src/k8s/resource-sizing.md.
        - alert: NodeMemoryLimitsOvercommitted
          expr: >-
            sum by (node) (kube_pod_container_resource_limits{resource="memory"})
            / on (node)
            sum by (node) (kube_node_status_allocatable{resource="memory"})
            > 2.5
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Memory limits on a node are far above its capacity
            description: >-
              Memory limits on {{ "{{ $labels.node }}" }} add up to more than 2.5 times its allocatable memory.
              Several pods bursting together would OOM-kill something; rebalance or trim limits.
