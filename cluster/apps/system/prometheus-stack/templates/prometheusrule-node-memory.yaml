apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-memory
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus-stack
spec:
  groups:
    - name: node.memory
      rules:
        # The mixin's NodeMemoryHighUtilization (disabled in values.yaml), now for
        # every node. nv1 used to be excluded because Gemma kept its unified memory
        # above 90%; with LFM3-VL-2B it sits at 30-55% (measured 2026-10-29), so a
        # sustained 90% there is a real problem.
        - alert: NodeMemoryHighUtilization
          expr: >-
            100 - (node_memory_MemAvailable_bytes{job="node-exporter"}
            / node_memory_MemTotal_bytes{job="node-exporter"} * 100) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node memory is over 90% utilized
            description: >-
              Memory utilization on {{ "{{ $labels.instance }}" }} has been above 90% for 15 minutes.
        # nv1 shares 15.6 GiB of unified memory with the GPU. With LFM3-VL-2B at two
        # slots MemAvailable sits at 6.8-10.7 GiB (6 h range, 2026-10-29); with the
        # old Gemma model it was 1.0-1.5 GiB. Below 3 GiB something has grown
        # (prompt cache, a bigger model, a second GPU workload). Below 400 MiB the
        # node is close to the OOM storm that killed cilium-envoy and node-exporter
        # (MemAvailable was about 120 MiB then).
        - alert: Nv1MemoryLowWarning
          expr: node_memory_MemAvailable_bytes{job="node-exporter",instance="192.168.48.5:9100"} < 3 * 1024 * 1024 * 1024
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: nv1 has less than 3 GiB of memory available
            description: >-
              nv1 MemAvailable has been under 3 GiB for 10 minutes. Normal is 6-10 GiB
              with the current llama-server settings; see the memory budget in
              docs/src/k8s/nv1-jetson.md.
        - alert: Nv1MemoryLow
          expr: node_memory_MemAvailable_bytes{job="node-exporter",instance="192.168.48.5:9100"} < 400 * 1024 * 1024
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: nv1 is nearly out of memory
            description: >-
              nv1 MemAvailable is under 400 MiB. llama-server (limit 8Gi) is the
              usual cause; see the memory budget in docs/src/k8s/nv1-jetson.md.
