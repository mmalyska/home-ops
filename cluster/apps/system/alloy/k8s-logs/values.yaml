alloy:
  alloy:
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 384Mi
    configMap:
      content: |
        discovery.kubernetes "pod" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            action        = "replace"
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            action        = "replace"
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "container"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
            action        = "replace"
            target_label  = "job"
            separator     = "/"
            replacement   = "$1"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.drop_noise.receiver]
        }

        // The Ceph mons log every admin-socket and mgr command at the audit
        // channel's DEBUG level (mon_status from the pod probes, mgr stat,
        // osd blocklist ls, fs dump): about 4,000 lines per mon in 10 minutes,
        // over half of the mon stream and 1.1 million lines a day. INFO
        // audit entries (config changes, auth) are kept.
        loki.process "drop_noise" {
          forward_to = [loki.write.loki.receiver]

          stage.match {
            selector = "{namespace=\"rook-ceph\", container=\"mon\"}"

            stage.drop {
              expression = "(^audit .* audit \\[DBG\\]|log_channel\\(audit\\) log \\[DBG\\])"
            }
          }

          // anytype's MongoDB logs five lines per connection (accepted, client
          // metadata, not authenticating, first command, ended) and the pod's
          // mongosh probes open about 50 connections a minute, all from
          // 127.0.0.1: about 2,200 of every 2,400 lines, 141 MB a day.
          // Message ids: 22943, 22944, 51800, 10483900, 6788700.
          stage.match {
            selector = "{namespace=\"anytype\", container=\"mongo\"}"

            stage.drop {
              expression = "\"id\":(22943|22944|51800|10483900|6788700),"
            }
          }
        }

        loki.write "loki" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
  controller:
    type: daemonset
    # nv1 (Jetson arm64 worker) carries a custom NoSchedule taint reserved
    # for AI/GPU workloads (same pattern as smartmon-exporter's toleration)
    # — without this, the DaemonSet only reaches the 3 amd64 control-plane
    # nodes and silently skips nv1 entirely (confirmed live: 3/3 ready,
    # not 4/4).
    tolerations:
      - key: nv
        operator: Equal
        value: NoSchedule
        effect: NoSchedule
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
