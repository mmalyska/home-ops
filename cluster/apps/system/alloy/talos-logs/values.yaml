alloy:
  alloy:
    # the raw syslog format of loki.source.syslog is experimental in Alloy
    stabilityLevel: experimental
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    configMap:
      content: |
        // Talos service logs (machine.logging, json_lines) and kernel log (KmsgLogConfig) arrive as UDP datagrams, one JSON
        // line each, read by the syslog receiver in raw mode (no syslog parsing). UDP, not TCP, so that replacing this pod does
        // not leave the nodes' connections stuck for minutes (a TCP connection stays pinned to the old pod).
        // The service logs carry the node name as extraTags; KmsgLogConfig has no extra tags in Talos v1.14, so the kernel
        // log uses one port per node and the listener sets the node label.
        loki.source.syslog "service_udp" {
          listener {
            address       = "0.0.0.0:5180"
            protocol      = "udp"
            syslog_format = "raw"
            labels        = { source = "talos-service" }
          }
          forward_to = [loki.process.service_udp.receiver]
        }

        loki.process "service_udp" {
          stage.json {
            expressions = {
              node       = "node",
              service    = "\"talos-service\"",
              level      = "\"talos-level\"",
              talos_time = "\"talos-time\"",
            }
          }
          stage.timestamp {
            source = "talos_time"
            format = "RFC3339Nano"
          }
          stage.labels {
            values = {
              node    = "",
              service = "",
              level   = "",
            }
          }
          forward_to = [loki.write.loki.receiver]
        }

        loki.source.syslog "kmsg_udp" {
          listener {
            address       = "0.0.0.0:5181"
            protocol      = "udp"
            syslog_format = "raw"
            labels        = { source = "talos-kernel", node = "mc1" }
          }
          listener {
            address       = "0.0.0.0:5182"
            protocol      = "udp"
            syslog_format = "raw"
            labels        = { source = "talos-kernel", node = "mc2" }
          }
          listener {
            address       = "0.0.0.0:5183"
            protocol      = "udp"
            syslog_format = "raw"
            labels        = { source = "talos-kernel", node = "mc3" }
          }
          listener {
            address       = "0.0.0.0:5184"
            protocol      = "udp"
            syslog_format = "raw"
            labels        = { source = "talos-kernel", node = "nv1" }
          }
          forward_to = [loki.process.kmsg_udp.receiver]
        }

        loki.process "kmsg_udp" {
          stage.json {
            expressions = {
              level      = "\"talos-level\"",
              talos_time = "\"talos-time\"",
            }
          }
          stage.timestamp {
            source = "talos_time"
            format = "RFC3339Nano"
          }
          stage.labels {
            values = {
              level = "",
            }
          }
          forward_to = [loki.write.loki.receiver]
        }

        loki.write "loki" {
          endpoint {
            url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
          }
        }
    extraPorts:
      - name: service-udp
        port: 5180
        targetPort: 5180
        protocol: UDP
      - name: mc1-udp
        port: 5181
        targetPort: 5181
        protocol: UDP
      - name: mc2-udp
        port: 5182
        targetPort: 5182
        protocol: UDP
      - name: mc3-udp
        port: 5183
        targetPort: 5183
        protocol: UDP
      - name: nv1-udp
        port: 5184
        targetPort: 5184
        protocol: UDP
  controller:
    type: deployment
    replicas: 1
  service:
    enabled: true
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "192.168.48.32"
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
