---
# CoreDNS is deployed with cluster.coreDNS.disabled: true in the Talos machine config, so
# Talos neither deploys nor reconciles it; these manifests mirror the live objects.
# ServiceAccount and the system:coredns ClusterRole/Binding are left as they are.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
