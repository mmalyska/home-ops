---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |-
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        # Upstreams come from the node resolver list (AdGuard .25, .31, then the UCG-Max).
        # sequential keeps the UCG-Max a pure fallback: it knows no internal names and
        # blocks nothing, so the default random policy broke both.
        forward . /etc/resolv.conf {
           max_concurrent 1000
           policy sequential
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
