descheduler:
  # Deployment, not the CronJob default: one long-lived pod keeps its logs and exposes metrics
  kind: Deployment
  deschedulingInterval: 10m

  # Live since the dry run showed only small stateless apps moving, never an excluded namespace or a PVC pod. To go back
  # to log-only, add `dry-run: true` here ("Evicted pod in dry run mode" lines in the log)
  cmdOptions:
    v: 4

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

  service:
    enabled: true
  serviceMonitor:
    enabled: true

  deschedulerPolicy:
    # the first dry-run cycle would have evicted 24 pods from mc3 at once (cert-manager, keycloak, the Ceph operator...):
    # move a few per 10-minute cycle instead, and never more than two from one namespace
    maxNoOfPodsToEvictTotal: 5
    maxNoOfPodsToEvictPerNode: 5
    maxNoOfPodsToEvictPerNamespace: 2
    profiles:
      - name: default
        pluginConfig:
          - name: DefaultEvictor
            args:
              # evict only when the pod would fit on another node (taints, affinity, resources): nv1 is tainted for
              # GPU work and must not count as free room
              nodeFit: true
              podProtections:
                defaultDisabled:
                  - PodsWithLocalStorage
                extraEnabled:
                  # keeps CNPG, Ceph and every other pod with a volume where it is
                  - PodsWithPVC
          - name: RemoveDuplicates
          - name: RemovePodsViolatingInterPodAntiAffinity
          - name: RemovePodsViolatingTopologySpreadConstraint
          - name: LowNodeUtilization
            args:
              thresholds:
                cpu: 30
                memory: 30
                pods: 30
              targetThresholds:
                cpu: 50
                memory: 50
                pods: 50
              # platform and edge namespaces stay where they are; only plain apps are moved
              evictableNamespaces:
                exclude:
                  - kube-system
                  - rook-ceph
                  - cnpg
                  - cert-manager
                  - argocd
                  - external-secrets
                  - envoy-gateway
                  - cloudflared
                  - identity
        plugins:
          balance:
            enabled:
              - RemoveDuplicates
              - RemovePodsViolatingTopologySpreadConstraint
              - LowNodeUtilization
          deschedule:
            enabled:
              - RemovePodsViolatingInterPodAntiAffinity
