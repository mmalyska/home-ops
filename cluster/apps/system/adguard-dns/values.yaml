external-dns:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "adguard-dns-secret"
  fullnameOverride: adguard-dns
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi
  env:
    - name: DOMAIN_FILTER
      valueFrom:
        secretKeyRef:
          name: adguard-dns-secret
          key: ADGUARD_DOMAIN_FILTER
  extraArgs:
    - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
    - --crd-source-kind=DNSEndpoint
    - --gateway-name=envoy-internal
    - --domain-filter=$(DOMAIN_FILTER)
    - --annotation-filter=external-dns.alpha.kubernetes.io/controller in (internal,dns-controller)
  logLevel: debug
  triggerLoopOnEvent: true
  policy: sync
  sources: ["crd", "gateway-httproute"]
  txtPrefix: k8s.main.
  txtOwnerId: main
  serviceMonitor:
    enabled: true
  provider:
    name: webhook
    webhook:
      image:
        repository: ghcr.io/muhlba91/external-dns-provider-adguard
        tag: v11.2.1@sha256:34efadcc9d16f8baad471d26b7caba2bd9466e230d434ffff822b574fda87753
      service:
        port: 8888
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        timeoutSeconds: 5
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        timeoutSeconds: 5
      env:
        - name: ADGUARD_URL
          valueFrom:
            secretKeyRef:
              name: adguard-dns-secret
              key: ADGUARD_URL
        - name: ADGUARD_USER
          valueFrom:
            secretKeyRef:
              name: adguard-dns-secret
              key: ADGUARD_USER
        - name: ADGUARD_PASSWORD
          valueFrom:
            secretKeyRef:
              name: adguard-dns-secret
              key: ADGUARD_PASSWORD
        - name: LOG_LEVEL
          value: debug
        - name: DRY_RUN
          value: "false"
