---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: sonarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: SONARR__AUTH__APIKEY
      remoteRef:
        key: "de6c7bb0-ca55-47dd-9fbd-b4e401035bad" #gitleaks:allow #SONARR_API_KEY
