# Virtual key for Lingarr. The operator writes the key into the Secret
# lingarr-litellm (key name `key`) in this namespace; the pod reads it as
# LOCAL_AI_API_KEY and Lingarr sends it as a Bearer token.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: lingarr
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keyAlias: lingarr
  proxyRef: litellm
  proxyNamespace: ai
  teamID: lingarr
  secretName: lingarr-litellm
  models: [local]
