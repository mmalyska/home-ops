# Virtual key for Lingarr. The operator writes the key into the Secret
# lingarr-litellm (key name `key`) in this namespace;
# it is not an env var (see values.yaml): paste it into the Lingarr UI, which stores it encrypted.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: lingarr
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keyAlias: lingarr
  proxyRef: litellm
  proxyNamespace: ai
  teamID: lingarr
  secretName: lingarr-litellm
  models: [local]
