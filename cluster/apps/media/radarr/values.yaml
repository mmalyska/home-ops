app-template:
  controllers:
    radarr:
      strategy: Recreate
      annotations:
        secret.reloader.stakater.com/reload: "radarr-secrets"
      pod:
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
      containers:
        app:
          image:
            repository: ghcr.io/home-operations/radarr
            tag: 6.4.4.10685@sha256:be53998a2d39cfa3c3315b70c7509a6a1f2a10c3aee9337653efc9f4c970430e
            pullPolicy: IfNotPresent
          env:
            TZ: CET
            RADARR__APP__INSTANCENAME: Radarr
            RADARR__SERVER__PORT: "7878"
            RADARR__LOG__DBENABLED: "False"
            RADARR__AUTH__REQUIRED: Enabled
          envFrom:
            - secretRef:
                name: radarr-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi

  service:
    app:
      ports:
        http:
          port: 7878

  route:
    app:
      kind: HTTPRoute
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - radarr.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: app
              port: 7878

  persistence:
    config:
      existingClaim: radarr
      advancedMounts:
        radarr:
          app:
            - path: /config
    media:
      existingClaim: media
      advancedMounts:
        radarr:
          app:
            - path: /data
    tmp:
      type: emptyDir
      advancedMounts:
        radarr:
          app:
            - path: /tmp

volsync:
  pvc:
    capacity: 5Gi
    storageClass: ceph-block
    volumeSnapshotClass: csi-ceph-blockpool
  volsync:
    moverSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    backup:
      schedule: "25 */12 * * *"
      pruneIntervalDays: 14
      retain:
        hourly: 24
        daily: 7
        weekly: 4
        monthly: 2
    restore:
      bootstrap: false
