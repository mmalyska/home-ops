---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: recyclarr-secrets
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  refreshInterval: 1h
  target:
    name: recyclarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: "de6c7bb0-ca55-47dd-9fbd-b4e401035bad" #gitleaks:allow #SONARR_API_KEY
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: "8b04c516-ab4b-446b-8721-b4e401036e8a" #gitleaks:allow #RADARR_API_KEY
