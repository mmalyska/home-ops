app-template:
  controllers:
    recyclarr:
      type: cronjob
      cronjob:
        schedule: "30 4 * * *"
        concurrencyPolicy: Forbid
        backoffLimit: 1
        successfulJobsHistory: 1
        failedJobsHistory: 3
      annotations:
        secret.reloader.stakater.com/reload: "recyclarr-secrets"
      pod:
        restartPolicy: Never
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          fsGroup: 1001
      containers:
        app:
          image:
            repository: ghcr.io/recyclarr/recyclarr
            tag: 8.8.0@sha256:b1fbb929ba718fdbdac2c1fc25b32b0ae916d7a5a0892c2068c9bfae6f1a9209
            pullPolicy: IfNotPresent
          args: ["sync"]
          env:
            TZ: CET
          envFrom:
            - secretRef:
                name: recyclarr-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 256Mi

  configMaps:
    config:
      data:
        # TRaSH WEB-1080p (Sonarr) and HD Bluray + WEB (Radarr), taken from the
        # recyclarr config-templates with only the default custom format groups.
        recyclarr.yml: |
          sonarr:
            web-1080p:
              base_url: http://sonarr.media.svc.cluster.local:8989
              api_key: !env_var SONARR_API_KEY
              quality_definition:
                type: series
              quality_profiles:
                - trash_id: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
                  reset_unmatched_scores:
                    enabled: true
              custom_format_groups:
                add:
                  - trash_id: 158188097a58d7687dee647e04af0da3 # [Optional] Golden Rule HD
                  - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4 # [Optional] Language Profiles
                  - trash_id: 85fae4a2294965b75710ef2989c850eb # [Streaming Services] HD/UHD boost
                  - trash_id: 59c3af66780d08332fdc64e68297098f # [Unwanted] Unwanted Formats
          radarr:
            hd-bluray-web:
              base_url: http://radarr.media.svc.cluster.local:7878
              api_key: !env_var RADARR_API_KEY
              quality_definition:
                type: movie
              quality_profiles:
                - trash_id: d1d67249d3890e49bc12e275d989a7e9 # HD Bluray + WEB
                  reset_unmatched_scores:
                    enabled: true
              custom_format_groups:
                add:
                  - trash_id: f8bf8eab4617f12dfdbd16303d8da245 # [Optional] Golden Rule HD
                  - trash_id: a3ac6af01d78e4f21fcb75f601ac96df # [Unwanted] Unwanted Formats

  persistence:
    config:
      type: emptyDir
      advancedMounts:
        recyclarr:
          app:
            - path: /config
    config-file:
      type: configMap
      identifier: config
      advancedMounts:
        recyclarr:
          app:
            - path: /config/recyclarr.yml
              subPath: recyclarr.yml
              readOnly: true
    tmp:
      type: emptyDir
      advancedMounts:
        recyclarr:
          app:
            - path: /tmp
