app-template:
  controllers:
    sabnzbd:
      strategy: Recreate
      pod:
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
          fsGroup: 1001
          fsGroupChangePolicy: OnRootMismatch
      containers:
        app:
          image:
            repository: ghcr.io/home-operations/sabnzbd
            tag: 5.1.3@sha256:c89b0322721c3eba47221e5f916505e7e742684651f73c5215717340b6b5402f
            pullPolicy: IfNotPresent
          env:
            TZ: CET
            SABNZBD__HOST_WHITELIST_ENTRIES: sabnzbd.<secret:private-domain>,sabnzbd,sabnzbd.media,sabnzbd.media.svc,sabnzbd.media.svc.cluster,sabnzbd.media.svc.cluster.local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi

  service:
    app:
      ports:
        http:
          port: 8080

  route:
    app:
      kind: HTTPRoute
      annotations:
        external-dns.alpha.kubernetes.io/controller: dns-controller
      parentRefs:
        - name: envoy-internal
          namespace: envoy-gateway
          sectionName: https
      hostnames:
        - sabnzbd.<secret:private-domain>
      rules:
        - backendRefs:
            - identifier: app
              port: 8080

  persistence:
    config:
      existingClaim: sabnzbd
      advancedMounts:
        sabnzbd:
          app:
            - path: /config
    incomplete:
      existingClaim: sabnzbd-incomplete
      advancedMounts:
        sabnzbd:
          app:
            - path: /incomplete
    media:
      existingClaim: media
      advancedMounts:
        sabnzbd:
          app:
            - path: /data
    tmp:
      type: emptyDir
      advancedMounts:
        sabnzbd:
          app:
            - path: /tmp

volsync:
  pvc:
    capacity: 2Gi
    storageClass: ceph-block
    volumeSnapshotClass: csi-ceph-blockpool
  volsync:
    moverSecurityContext:
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
    backup:
      schedule: "10 */12 * * *"
      pruneIntervalDays: 14
      retain:
        hourly: 24
        daily: 7
        weekly: 4
        monthly: 2
    restore:
      bootstrap: false
