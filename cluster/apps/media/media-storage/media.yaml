---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media
spec:
  storageClassName: nfs-qnap
  claimRef:
    name: media
    namespace: media
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: qnap.<secret:private-domain>
    path: "/media"
  mountOptions:
    - nfsvers=4.1
    - tcp
    - intr
    - hard
    - noatime
    - nodiratime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: media
spec:
  volumeName: media
  storageClassName: nfs-qnap
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
