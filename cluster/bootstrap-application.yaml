apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/mmalyska/home-ops
      targetRevision: main
      path: cluster/projects
    - repoURL: https://github.com/mmalyska/home-ops
      targetRevision: main
      path: cluster/appsets
    - repoURL: https://github.com/mmalyska/home-ops # bootstrap application self management
      targetRevision: main
      path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  ignoreDifferences:
    # The API server drops the default value (false) from the live ApplicationSet, so
    # a manifest that sets it explicitly shows as OutOfSync forever.
    - group: argoproj.io
      kind: ApplicationSet
      jsonPointers:
        - /spec/syncPolicy/preserveResourcesOnDeletion
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    automated:
      enabled: false
      selfHeal: true
