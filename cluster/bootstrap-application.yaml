apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  annotations:
    # Refresh root-app on a webhook push only when one of its three sources changed.
    argocd.argoproj.io/manifest-generate-paths: /cluster/projects;/cluster/appsets;/cluster/bootstrap-application.yaml
spec:
  project: default
  sources:
    - repoURL: https://github.com/mmalyska/home-ops
      targetRevision: main
      path: cluster/projects
    - repoURL: https://github.com/mmalyska/home-ops
      targetRevision: main
      path: cluster/appsets
    - repoURL: https://github.com/mmalyska/home-ops # bootstrap application self management
      targetRevision: main
      path: cluster
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    automated:
      enabled: true
      selfHeal: true
      prune: false # root-app manages projects, appsets and itself: never prune
