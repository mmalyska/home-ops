# What:   DNS servers for the node itself (the two in-cluster AdGuard instances first, the router last) and the host DNS caching resolver
# Why:    Internal-only names (S3, QNAP, the OIDC issuer) exist only in AdGuard; the router serves public names only.
#         Talos refuses ResolverConfig next to the legacy machine.network.nameservers and machine.features.hostDNS,
#         so both move together (the legacy hostDNS field is deleted from the base in 60-features.yaml)
# Nodes:  all nodes
# Apply:  live
apiVersion: v1alpha1
kind: ResolverConfig
# Host-originated traffic reaches both LB addresses from every node (externalTrafficPolicy: Local
# does not apply to it), including nodes that run no AdGuard pod. The UCG-Max (public names only)
# is the fallback if both AdGuard instances are down. The order is the lookup order: since Talos 1.13
# ResolverConfig nameservers replace lower layers instead of merging.
nameservers:
  - address: 192.168.48.25
    protocol: Do53
  - address: 192.168.48.31
    protocol: Do53
  - address: 192.168.48.254
    protocol: Do53
hostDNS:
  enabled: true
  forwardKubeDNSToHost: false
  resolveMemberNames: true
