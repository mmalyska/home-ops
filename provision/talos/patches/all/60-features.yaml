# What:   Disk quota support, host DNS with member-name resolution; drops the generated legacy kubePrism field
# Why:    Platform features the cluster relies on: XFS project quotas, member names in host DNS. The gen config
#         base adds machine.features.kubePrism, which Talos refuses next to the KubePrismConfig document (61-kubeprism.yaml)
# Nodes:  all nodes
# Apply:  live
machine:
  features:
    diskQuotaSupport: true
    kubePrism:
      $patch: delete
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: false
      resolveMemberNames: true
