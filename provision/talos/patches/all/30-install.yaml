# What:   Install behaviour for every node: the unattended install never wipes the system disk
# Why:    The UnattendedInstallConfig document only acts when a node is not installed yet (a node booted from USB or PXE
#         in maintenance mode installs itself with it); on an installed node it is inert apart from naming the installer
#         image that upgrades use. wipe defaults to true in this document, so false is written explicitly: a deliberate
#         wipe is a manual decision (talosctl reset still wipes when asked). The install disk is /dev/nvme0n1 on every node, so
#         the disk selector (CEL) is set once here; the installer image is set per role and per node (controlplane/05,
#         worker/05, node/nv1/20). This needs Talos 1.14.5 or newer: before it, talosctl machineconfig patch dropped
#         provisioning.diskSelector.match when a later patch merged into the document, so the selector was repeated in
#         every installer image patch. A node with another disk needs its own selector in a later patch.
#         The legacy grubUseUKICmdline has no counterpart: the nodes boot with UKI, grub is not involved
# Nodes:  all nodes
# Apply:  install-only
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: false
