# What:   Remove the cluster.network block that talosctl gen config adds
# Why:    Talos refuses the legacy block next to the KubeNetworkConfig document (80-cluster-network.yaml). Without the legacy
#         block and without a KubeFlannelCNIConfig document Talos deploys no CNI
# Nodes:  all nodes
# Apply:  live
cluster:
  network:
    $patch: delete
