# What:   TEMPORARY pilot: hourly filesystem scrub (xfs_scrub) on this node (the pilot is mc3 and nv1 only)
# Why:    Scrubbing is off today. The pilot runs on nv1 (no etcd, smallest filesystem) and mc3 (a control plane, to watch etcd fsync
#         latency, because the NVMe I/O scheduler is `none` and the scrub's idle I/O class is probably not enforced) with a 1 hour
#         interval so a scrub runs within the hour instead of within a week. Talos starts it at a stable hash-derived time inside
#         the interval. Replace both node files with one all/ file at 168h0m0s once the pilot looks good (see .plans/TODO.md)
# Nodes:  mc3
# Apply:  live
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 1h
