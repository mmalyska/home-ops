# What:   Workload isolation on nv1: CRI, the kubelet and all pods run in the sandboxd PID and mount namespace, apart from machined (PID 1)
# Why:    Enabled on nv1 by the owner's decision on 2026-10-07, earlier than the spec's soak gate (nv1 had been on v1.14.2 for hours;
#         docs/superpowers/specs/2026-10-07-talos-workload-isolation-design.md). v1.14.2 carries the fix for the boot bug that
#         made this unsafe on v1.14.0 (siderolabs/talos#14374). sandboxd reads the setting only when it starts, so the node
#         needs a reboot after the apply. Phase 2 moves this to patches/all/65-security-profile.yaml and deletes this file
# Nodes:  nv1
# Apply:  reboot (sandboxd reads workloadIsolation only when the service starts)
apiVersion: v1alpha1
kind: SecurityProfileConfig
workloadIsolation: true
