# What:   Kernel module nvhwpm
# Why:    JetPack 7 (r39) hardware performance monitor; tegra_drm depends on it (r36 loaded it implicitly as a dependency). The load order is the file order: 28 to 38, the host1x stack first. Modules are ABI-bound to the custom installer's kernel (nv1's install image)
# Nodes:  nv1
# Apply:  reboot (modules and their parameters are only loaded at boot)
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvhwpm
