# What:   Ship the kernel log (kmsg) to the Alloy receiver in the cluster, UDP port 5182
# Why:    Boot and shutdown messages (including the ones from the failed nv1 boots) survive the reboot. KmsgLogConfig has no
#         extraTags in Talos v1.14, so each node uses its own port and the receiver sets the node label from it
#         (cluster/apps/system/alloy/talos-logs)
# Nodes:  mc2
# Apply:  live
apiVersion: v1alpha1
kind: KmsgLogConfig
name: loki
url: udp://192.168.48.32:5182/
