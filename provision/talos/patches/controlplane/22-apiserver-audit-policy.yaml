# What:   API audit log: every request at Metadata level
# Why:    Who did what is recorded without storing request or response bodies
# Nodes:  control plane
# Apply:  live (the kube-apiserver static pod restarts)
cluster:
  apiServer:
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: Metadata
