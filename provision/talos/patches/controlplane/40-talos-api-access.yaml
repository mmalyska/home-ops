# What:   Let the talos-backup and tuppr namespaces call the Talos API (os:etcd:backup and os:admin roles)
# Why:    talos-backup takes etcd snapshots and tuppr upgrades nodes through the Kubernetes-to-Talos API bridge. The document
#         enables the bridge by existing. It has one roles list and one namespaces list, so both namespaces get both roles:
#         talos-backup gains os:admin (accepted, it only holds the backup CronJobs); nothing else may use the namespace tuppr
# Nodes:  control plane
# Apply:  live
apiVersion: v1alpha1
kind: KubeTalosAPIAccessConfig
allowedRoles:
  - os:etcd:backup
  - os:admin
allowedKubernetesNamespaces:
  - talos-backup
  - tuppr
