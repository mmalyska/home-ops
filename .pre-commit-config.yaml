---
fail_fast: false
default_install_hook_types: [pre-commit, commit-msg]
exclude: |
  (?x)^(
      docs/_assets/.*
    | .*\.sops\.toml
    | .*\.patch
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-claude-attribution
        name: no Claude attribution in commit message
        description: Reject Claude Code co-author, session URL and "generated with" lines. Mirrors .github/workflows/no-claude-attribution.yaml.
        language: pygrep
        entry: '(?i)(noreply@anthropic\.com|claude\.ai/code/session|^Claude-Session:|Generated with \[Claude|^Co-Authored-By:\s*Claude)'
        stages: [commit-msg]
