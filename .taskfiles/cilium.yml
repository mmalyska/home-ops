---
version: "3"

vars:
  # renovate: datasource=github-releases depName=cilium/cilium-cli
  CILIUM_VERSION: "v0.20.1"
  CLI_ARCH:
    sh: 'if [ "$(uname -m)" = "aarch64" ]; then echo "arm64"; else echo "amd64"; fi'

tasks:
  init:
    desc: Init cilium (task cilium:init)
    cmds:
      - task: install

  install:
    desc: Install cilium (task cilium:install)
    cmds:
      - task: install:cli

  install:cli:
    internal: true
    desc: Install cilium cli when it is missing or older than CILIUM_VERSION (a newer one is left alone)
    cmds:
      - |
        set -euo pipefail
        if ! command -v sudo >/dev/null 2>&1; then
          echo "ERROR: cilium is missing or older than {{ .CILIUM_VERSION }} and sudo is not available; install cilium-cli {{ .CILIUM_VERSION }} or newer" >&2
          exit 1
        fi
        work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT
        cd "$work"
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/{{ .CILIUM_VERSION }}/cilium-linux-{{ .CLI_ARCH }}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-{{ .CLI_ARCH }}.tar.gz.sha256sum
        sudo tar xzvfC cilium-linux-{{ .CLI_ARCH }}.tar.gz /usr/local/bin
    status:
      # Up to date when the installed client is the pin or newer.
      - |
        need="{{ .CILIUM_VERSION }}"; need="${need#v}"
        have="$(cilium version --client 2>/dev/null | sed -n 's/^cilium-cli: v\{0,1\}\([^ ]*\).*/\1/p' | head -n1)"
        [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" = "$need" ]
