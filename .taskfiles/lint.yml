---
version: "3"

tasks:
  all:
    - task: markdown
    - task: yaml
    - task: prettier:check

  markdown:
    desc: Lint Markdown
    cmds:
      - markdownlint *.md **/*.md
    ignore_error: true

  yaml:
    desc: Lint YAML
    cmds:
      - yamllint -c '.github/linters/.yamllint.yaml' .
    ignore_error: true

  prettier:check:
    desc: Lint general formatting (task lint:prettier:check)
    cmds:
      - prettier --ignore-unknown --check .
    ignore_error: true

  prettier:fix:
    desc: Lint general formatting (task lint:prettier:fix)
    cmds:
      - prettier --ignore-unknown --write .
    ignore_error: true
