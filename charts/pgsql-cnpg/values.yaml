# #   - name: <cluster-name>-backup
# #     plugin:
# #       name: barman-cloud.cloudnative-pg.io
# #       parameters:
# #         barmanObjectName: <name>-objectstore
monitoring:
  enablePodMonitor: true
# Default sidecar env for every CNPG cluster's barman-cloud plugin — required
# for reliable S3 uploads against some S3-compatible backends. Override per
# app only if a specific cluster needs something different.
instanceSidecarConfiguration:
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
# Default archive_timeout — CNPG's own built-in default is 5min, which forces
# a full WAL segment to S3 every 5 minutes regardless of actual write
# activity. 30min cuts that churn substantially while still being backed by
# 2-instance streaming replication for primary durability. Override per app
# if a specific cluster needs a tighter RPO.
postgresql:
  parameters:
    archive_timeout: "30min"
    # WAL compression, off by default in PostgreSQL. Every WAL byte is
    # written to a Ceph RBD volume and replicated 3x onto consumer-grade
    # MX500 SSDs that are already at 62-70% rated life. Full-page writes
    # (emitted after each checkpoint for every touched page) compress
    # particularly well, so this cuts real bytes written for a little CPU.
    # Safe and long-established — it compresses the WAL record payload and
    # changes nothing about durability or replication semantics.
    wal_compression: "on"
