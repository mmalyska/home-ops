---
version: "3"

vars:
  PROJECT_DIR:
    sh: "git rev-parse --show-toplevel"
  CLUSTER_DIR: "{{.PROJECT_DIR}}/cluster"
  TERRAFORM_DIR: "{{.PROJECT_DIR}}/provision/terraform"
  TALOS_DIR: "{{.PROJECT_DIR}}/provision/talos"

env:
  KUBECONFIG: "/home/vscode/.kube/config"

includes:
  bootstrap: .taskfiles/bootstrap
  external-secrets: .taskfiles/externalsecrets
  argocd: .taskfiles/argocd
  precommit: .taskfiles/pre-commit.yml
  terraform: .taskfiles/terraform.yml
  kubernetes: .taskfiles/kubernetes
  format: .taskfiles/format.yml
  lint: .taskfiles/lint.yml
  talos: .taskfiles/talos
  mkdocs: .taskfiles/mkdocs.yml
  cilium: .taskfiles/cilium.yml
  volsync: .taskfiles/volsync

tasks:
  default: task -l
  init:
    desc: Check that the workstation tools are present (the dev-workstation image provides them)
    cmds:
      - echo "All required tools are present."
    preconditions:
      - sh: |
          missing=""
          for t in direnv egctl gitleaks task helm ipcalc jq kubectl kustomize prettier stern terraform yamllint yq argocd kubelogin k9s pre-commit mkdocs gh helmfile chezmoi node; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          [ -z "$missing" ] || { echo "missing tools:$missing" >&2; exit 1; }
        msg: |
          Some required tools are missing (listed above). Use the dev-workstation image,
          or on a machine without it run `task init:brew` (Homebrew).

  init:brew:
    desc: Install workstation tools with Homebrew, for a machine without the dev-workstation image
    cmds:
      - brew update
      - brew bundle upgrade --file=.github/.devcontainer/local-features/common/Brewfile {{.CLI_ARGS}}
    preconditions:
      - sh: command -v brew
        msg: |
          Homebrew is not installed. Using MacOS, Linux or WSL?
          Head over to https://brew.sh to get up and running.
      - sh: test -f .github/.devcontainer/local-features/common/Brewfile
        msg: The Brewfile is missing.
