---
name: Docs build

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/mkdocs/**"
      - ".github/workflows/docs-build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@v5 # Using a stable tag would be safer but keeping as requested
        with:
          version: "latest"
          enable-cache: true
      - name: Setup Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv pip install --system -r .github/mkdocs/requirements.txt
      - name: Build site (strict, not deployed)
        run: uv run mkdocs build --strict --config-file .github/mkdocs/mkdocs.yml --site-dir "${RUNNER_TEMP}/site"
