---
name: Docs build

# Pull-request build of the public docs site. publish-pages.yaml only builds on a push to main, so a
# broken nav entry or link would otherwise surface after the merge, on the publication path.
# Builds only: nothing is deployed, the token is read-only and no secret is used.

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/mkdocs/**"
      - ".github/workflows/docs-build.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The git-revision-date-localized plugin warns on a shallow clone, and --strict turns a warning into a failure.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - name: Install MkDocs
        run: pip install mkdocs[i18n]
      - name: Install requirements
        run: pip install -r .github/mkdocs/requirements.txt
      - name: Build site (strict, not deployed)
        run: mkdocs build --strict --config-file .github/mkdocs/mkdocs.yml --site-dir "${RUNNER_TEMP}/site"
