name: Deploy MkDocs with GitHub Pages dependencies preinstalled

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-pages.yaml"
      - ".github/mkdocs/**"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Setup Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv pip install --system -r .github/mkdocs/requirements.txt
      - name: Setup caching
        uses: actions/cache@v6
        with:
          key: ${{ github.sha }}
          path: .cache
      - name: Build site
        run: uv run mkdocs build --config-file .github/mkdocs/mkdocs.yml --site-dir ./site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
