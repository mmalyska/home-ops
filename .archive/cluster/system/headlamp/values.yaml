headlamp:
  deploymentAnnotations:
    secret.reloader.stakater.com/reload: "headlamp-oidc"
  replicaCount: 1

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  config:
    inCluster: true
    inClusterContextName: "home"
    oidc:
      secret:
        create: false
      externalSecret:
        enabled: true
        name: headlamp-oidc

  clusterRoleBinding:
    create: true
    clusterRoleName: cluster-admin

  service:
    type: ClusterIP
    port: 80
